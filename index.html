<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenda de Zé Cigano</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-card: #141414;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #2a2a2a;
    }

    html, body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Cabeçalho */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: #000;
      border-bottom: 1px solid var(--border-color);
    }

    .title-box h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .title-box p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* Barra de Pesquisa */
    .search-container {
      margin-bottom: 20px;
      position: relative;
    }

    .search-container i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--gold-primary);
    }

    /* Cards e Lista de Membros */
    .membros-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
    }

    .membro-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      text-align: left;
      position: relative;
    }

    .membro-card h3 {
      margin: 0 0 5px 0;
      font-size: 1rem;
      color: var(--gold-light);
    }

    .membro-card p {
      margin: 2px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-editar {
      margin-top: 10px;
      background-color: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-editar:hover {
      background-color: var(--gold-primary);
      color: #000;
    }

    /* Modal de Edição */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
    }

    .modal-content h2 {
      margin-top: 0;
      color: var(--gold-primary);
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 4px;
      box-sizing: border-box;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-salvar {
      background-color: var(--gold-primary);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-cancelar {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-membros {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="title-box">
      <h1>Tenda de Zé Cigano</h1>
      <p>Terreiro de Umbanda</p>
    </div>
    
    <!-- Área do Usuário (Sempre Deslogado ao Abrir) -->
    <div id="userArea">
      <button class="btn-membros" onclick="fazerLogin()"><i class="fa-solid fa-lock"></i> Membros</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Campo de Pesquisa -->
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input 
        type="text" 
        id="inputPesquisa" 
        class="search-input" 
        placeholder="Pesquisar filho de santo por nome..."
        onkeyup="filtrarMembros()"
      >
    </div>

    <!-- Lista de Membros -->
    <div id="membrosGrid" class="membros-grid"></div>

  </div>

  <!-- Modal de Edição -->
  <div id="modalEdicao" class="modal-overlay">
    <div class="modal-content">
      <h2>Editar Membro</h2>
      <form id="formEditarMembro" onsubmit="salvarEdicao(event)">
        <input type="hidden" id="editId">
        
        <div class="form-group">
          <label for="editNome">Nome:</label>
          <input type="text" id="editNome" required>
        </div>

        <div class="form-group">
          <label for="editCargo">Cargo / Função:</label>
          <input type="text" id="editCargo" required>
        </div>

        <div class="form-group">
          <label for="editTelefone">Telefone:</label>
          <input type="text" id="editTelefone">
        </div>

        <div class="modal-buttons">
          <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn-salvar">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // =================================================================
    // 1. FORÇAR A PÁGINA A ABRIR SEMPRE DESLOGADA
    // =================================================================
    window.addEventListener('DOMContentLoaded', () => {
      localStorage.clear();
      sessionStorage.clear();

      if (typeof firebase !== 'undefined' && firebase.auth) {
        firebase.auth().signOut();
      }

      carregarMembros();
    });

    // =================================================================
    // 2. DADOS DOS MEMBROS & CARREGAMENTO
    // =================================================================
    let listaMembros = [
      { id: "1", nome: "João de Ogum", cargo: "Filho de Santo", telefone: "(31) 99999-0001" },
      { id: "2", nome: "Maria de Oxum", cargo: "Filha de Santo", telefone: "(31) 99999-0002" },
      { id: "3", nome: "Carlos de Oxóssi", cargo: "Cambone", telefone: "(31) 99999-0003" },
      { id: "4", nome: "Ana de Iemanjá", cargo: "Filha de Santo", telefone: "(31) 99999-0004" }
    ];

    function carregarMembros() {
      renderizarGrid(listaMembros);
    }

    function renderizarGrid(membros) {
      const grid = document.getElementById('membrosGrid');
      grid.innerHTML = '';

      membros.forEach(membro => {
        const card = document.createElement('div');
        card.className = 'membro-card';
        card.innerHTML = `
          <h3>${membro.nome}</h3>
          <p><strong>Cargo:</strong> ${membro.cargo}</p>
          <p><strong>Telefone:</strong> ${membro.telefone}</p>
          <button class="btn-editar" onclick="abrirModalEdicao('${membro.id}')">
            <i class="fa-solid fa-pen"></i> Editar
          </button>
        `;
        grid.appendChild(card);
      });
    }

    // =================================================================
    // 3. FUNÇÃO DE FILTRO / PESQUISA EM TEMPO REAL
    // =================================================================
    function filtrarMembros() {
      const termo = document.getElementById('inputPesquisa').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.membro-card');

      cards.forEach(card => {
        const texto = card.textContent.toLowerCase();
        if (texto.includes(termo)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // =================================================================
    // 4. EDIÇÃO DE MEMBROS (PREENCHIMENTO AUTOMÁTICO DOS DADOS)
    // =================================================================
    function abrirModalEdicao(id) {
      // Localiza o membro correto pelo ID
      const membro = listaMembros.find(m => m.id === id);

      if (membro) {
        // Preenche automaticamente os campos do modal com os dados do membro
        document.getElementById('editId').value = membro.id;
        document.getElementById('editNome').value = membro.nome;
        document.getElementById('editCargo').value = membro.cargo;
        document.getElementById('editTelefone').value = membro.telefone;

        // Exibe o modal na tela
        document.getElementById('modalEdicao').style.display = 'flex';
      }
    }

    function fecharModal() {
      document.getElementById('modalEdicao').style.display = 'none';
    }

    function salvarEdicao(event) {
      event.preventDefault();
      
      const id = document.getElementById('editId').value;
      const membro = listaMembros.find(m => m.id === id);

      if (membro) {
        // Atualiza os dados na lista
        membro.nome = document.getElementById('editNome').value;
        membro.cargo = document.getElementById('editCargo').value;
        membro.telefone = document.getElementById('editTelefone').value;

        // Atualiza a visualização na tela
        renderizarGrid(listaMembros);
        filtrarMembros(); // Reaplica o filtro caso haja pesquisa ativa
        fecharModal();
      }
    }

    function fazerLogin() {
      alert("Redirecionando para o login...");
    }
  </script>
</body>
</html>
