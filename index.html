<!DOCTYPE html>
<html lang="pt-BR">
<head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenda de Zé Cigano — Ponte de teste V06</title>
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden}iframe{display:block}</style>
</head>
<body>
  <!-- A interface aprovada segue no GitHub Pages; esta página encaminha somente funções autorizadas. -->
  <iframe id="tzcSite" src="https://terreirotendadezecigano-hub.github.io/site-teste/?versao=V27" title="Tenda de Zé Cigano"></iframe>
  <script>
  (function(){
    'use strict';
    var origemPermitida='https://terreirotendadezecigano-hub.github.io';
    var site=document.getElementById('tzcSite');
    /* Lista fechada: o navegador não escolhe nomes arbitrários do Apps Script. */
    var rotas={
      verificarEmail:{funcao:'TZC_M02_verificarEmailV06',tamanhos:[254]},
      solicitarCodigo:{funcao:'TZC_M02_solicitarCodigoV06',tamanhos:[254]},
      validarCodigo:{funcao:'TZC_M02_validarCodigo',tamanhos:[254,6]},
      validarSessao:{funcao:'TZC_M02_validarSessao',tamanhos:[100]},
      encerrarSessao:{funcao:'TZC_M02_encerrarSessao',tamanhos:[100]},
      listarAgendaPublica:{funcao:'TZC_M04_listarAgendaPublica',tamanhos:[]},
      responderEvento:{funcao:'TZC_M04_responderEvento',tamanhos:[4000]},
      registrarCheckin:{funcao:'TZC_M04_registrarCheckin',tamanhos:[100,100,30]},
      obterCheckinsPendentes:{funcao:'TZC_M04_obterCheckinsPendentes',tamanhos:[100]},
      listarEventosGestao:{funcao:'TZC_M04_listarEventosGestao',tamanhos:[100]},
      listarPendencias:{funcao:'TZC_M04_listarPendencias',tamanhos:[100,100]},
      listarEventosRelatorio:{funcao:'TZC_M04_listarEventosRelatorio',tamanhos:[100]},
      gerarPrevisaoEvento:{funcao:'TZC_M04_gerarPrevisaoEvento',tamanhos:[100,100]},
      confirmarCheckin:{funcao:'TZC_M04_confirmarCheckin',tamanhos:[100,100,30]},
      listarMembrosAtivos:{funcao:'TZC_M04_listarMembrosAtivos',tamanhos:[100]},
      definirResponsavel:{funcao:'TZC_M04_definirResponsavel',tamanhos:[100,100,100,10]}
    };
    function responder(id,resultado){if(site&&site.contentWindow)site.contentWindow.postMessage({tipo:'TZC_M02_RESULT',id:id,resultado:resultado},origemPermitida)}
    window.addEventListener('message',function(evento){
      if(evento.origin!==origemPermitida||!site||evento.source!==site.contentWindow)return;
      var msg=evento.data;
      if(!msg||msg.tipo!=='TZC_M02_RPC'||typeof msg.id!=='string'||!/^tzc_m02_[0-9]+_[0-9]+$/.test(msg.id))return;
      var rota=rotas[msg.acao],args=msg.args;
      if(!rota||!Array.isArray(args)||args.length!==rota.tamanhos.length||args.some(function(v,i){return typeof v!=='string'||v.length>rota.tamanhos[i]})){
        responder(msg.id,{ok:false,mensagem:'Solicitação inválida.'});return;
      }
      var runner=google.script.run.withSuccessHandler(function(r){responder(msg.id,r)}).withFailureHandler(function(){responder(msg.id,{ok:false,mensagem:'Não foi possível concluir a solicitação agora.'})});
      runner[rota.funcao].apply(runner,args);
    });
  })();
  </script>
</body></html>
