<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Membro - Tenda de Zé Cigano</title>
  <style>
    /* Fundo Geral */
    body {
      background-color: #0d0003;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    /* Card/Modal no estilo do telemóvel */
    .mobile-card {
      background-color: #24050b;
      border: 2px solid #d4af37;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Cabeçalho */
    .header {
      text-align: center;
      position: relative;
      margin-bottom: 20px;
    }

    .close-btn {
      position: absolute;
      top: -5px;
      right: 0;
      color: #ffffff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #d4af37;
    }

    .site-title {
      color: #f3d45a;
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
      line-height: 1.2;
    }

    .modal-title {
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: bold;
      margin: 10px 0 0 0;
    }

    /* Formulários */
    .form-group {
      margin-bottom: 12px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      color: #ffffff;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      background-color: #120205;
      border: 1px solid #d4af37;
      border-radius: 8px;
      color: #ffffff;
      padding: 8px 10px;
      font-size: 0.85rem;
      box-sizing: border-box;
      outline: none;
    }

    input::placeholder {
      color: #887075;
    }

    /* Secção de Upload de Imagem */
    .upload-section {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }

    .profile-thumb {
      width: 45px;
      height: 45px;
      border-radius: 6px;
      border: 1px solid #d4af37;
      object-fit: cover;
    }

    .btn-file {
      background-color: #1a56b4;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-remove {
      color: #ffffff;
      text-decoration: underline;
      font-size: 0.75rem;
      cursor: pointer;
      background: none;
      border: none;
    }

    /* Divisórias de Secção */
    .section-label {
      color: #f3d45a;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 15px 0 8px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 4px;
    }

    /* Botões de Ação Inferiores */
    .footer-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-action-blue {
      flex: 1;
      background-color: #1a56b4;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-action-red {
      flex: 1;
      background-color: #a31c1c;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="mobile-card">
    <div class="header">
      <span class="close-btn">✕</span>
      <div class="logo-container">
        <img src="https://via.placeholder.com/40" alt="Logo" class="logo-img">
        <div class="site-title">Tenda de<br>Zé Cigano</div>
      </div>
      <h2 class="modal-title">Cadastrar Membro</h2>
    </div>

    <div class="form-group">
      <label>Nome Completo</label>
      <input type="text" placeholder="Nome do integrante">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Data de Nascimento</label>
        <input type="text" placeholder="dd/mm/aaaa">
      </div>
      <div class="form-group">
        <label>Telefone / WhatsApp</label>
        <input type="text" placeholder="(21) 99988-5538">
      </div>
    </div>

    <div class="form-group">
      <label>E-mail</label>
      <input type="email" placeholder="email@exemplo.com">
    </div>

    <div class="form-group">
      <label>Endereço Completo</label>
      <input type="text" placeholder="Rua, número, complemento, bairro, cidade, UF">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>RG</label>
        <input type="text" placeholder="RG">
      </div>
      <div class="form-group">
        <label>CPF</label>
        <input type="text" placeholder="CPF">
      </div>
    </div>

    <div class="form-group">
      <label>Alergias / Problemas de saúde</label>
      <div class="upload-section">
        <img src="https://via.placeholder.com/45" alt="Thumb" class="profile-thumb">
        <button class="btn-file">Escolher Arquivo</button>
        <button class="btn-remove">Remover</button>
      </div>
    </div>

    <div class="section-label">Dados da casa</div>

    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select>
          <option>Ativo</option>
          <option>Inativo</option>
        </select>
      </div>
      <div class="form-group">
        <label>Cargo / Função</label>
        <input type="text" placeholder="Cargo">
      </div>
    </div>

    <div class="footer-buttons">
      <button class="btn-action-blue">Confirmar</button>
      <button class="btn-action-red">Salvar Membro</button>
    </div>
  </div>

</body>
</html>
