<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenda de Zé Cigano - Terreiro de Umbanda</title>
  <style>
    /* RESET E ESTILOS GERAIS DE BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }

    header {
      background-color: #5c0606;
      border-bottom: 2px solid #d4af37;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header-title h1 {
      color: #d4af37;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-title p {
      color: #f0e68c;
      font-size: 0.85rem;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .section-title {
      color: #d4af37;
      font-size: 1.3rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    /* GRID ESTILO GUIA SAGRADO DE ERVAS & BANHOS */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .card-item {
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .card-item:hover {
      border-color: #d4af37;
      background-color: #252525;
      transform: translateY(-3px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.15);
    }

    .card-icon {
      font-size: 2rem;
      color: #d4af37;
    }

    .card-title {
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* REPRODUTOR DE VÍDEO / ÁUDIO PARA PONTOS */
    .media-player-container {
      background-color: #1a1a1a;
      border: 1px solid #d4af37;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }

    .media-player-container h3 {
      color: #d4af37;
      margin-bottom: 15px;
    }

    video, audio {
      width: 100%;
      max-width: 800px;
      border-radius: 6px;
      outline: none;
      background-color: #000;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 0.85rem;
      border-top: 1px solid #222;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <div>
        <h1>Tenda de Zé Cigano</h1>
        <p>Terreiro de Umbanda</p>
      </div>
    </div>
  </header>

  <main>
    <!-- SEÇÃO: PONTOS CANTADOS (VISUAL NO ESTILO ERVAS & BANHOS) -->
    <section>
      <h2 class="section-title">📌 Coletânea de Pontos Cantados</h2>
      
      <div class="grid-container" id="grid-pontos">
        <div class="card-item" onclick="carregarPonto('Ponto de Abertura', 'https://www.w3schools.com/html/mov_bbb.mp4')">
          <div class="card-icon">🎵</div>
          <div class="card-title">Ponto de Abertura</div>
        </div>

        <div class="card-item" onclick="carregarPonto('Ponto de Oxalá', 'https://www.w3schools.com/html/mov_bbb.mp4')">
          <div class="card-icon">🕊️</div>
          <div class="card-title">Ponto de Oxalá</div>
        </div>

        <div class="card-item" onclick="carregarPonto('Ponto de Ogum', 'https://www.w3schools.com/html/mov_bbb.mp4')">
          <div class="card-icon">⚔️</div>
          <div class="card-title">Ponto de Ogum</div>
        </div>

        <div class="card-item" onclick="carregarPonto('Ponto de Oxóssi', 'https://www.w3schools.com/html/mov_bbb.mp4')">
          <div class="card-icon">🏹</div>
          <div class="card-title">Ponto de Oxóssi</div>
        </div>

        <div class="card-item" onclick="carregarPonto('Ponto de Yemanjá', 'https://www.w3schools.com/html/mov_bbb.mp4')">
          <div class="card-icon">🌊</div>
          <div class="card-title">Ponto de Yemanjá</div>
        </div>

        <div class="card-item" onclick="carregarPonto('Ponto dos Pretos Velhos', 'https://www.w3schools.com/html/mov_bbb.mp4')">
          <div class="card-icon">☕</div>
          <div class="card-title">Pretos Velhos</div>
        </div>
      </div>

      <!-- REPRODUTOR DE VÍDEO COMPATÍVEL -->
      <div class="media-player-container" id="player-box" style="display: none;">
        <h3 id="ponto-titulo">Nome do Ponto</h3>
        <video id="video-player" controls preload="metadata" playsinline>
          <source id="video-source" src="" type="video/mp4">
          Seu navegador não suporta a exibição deste vídeo.
        </video>
      </div>
    </section>
  </main>

  <footer>
    &copy; Tenda de Zé Cigano | Axé!
  </footer>

  <script>
    function carregarPonto(titulo, urlVideo) {
      const playerBox = document.getElementById('player-box');
      const pontoTitulo = document.getElementById('ponto-titulo');
      const videoPlayer = document.getElementById('video-player');
      const videoSource = document.getElementById('video-source');

      pontoTitulo.textContent = titulo;
      videoSource.src = urlVideo;

      // Recarrega o elemento de vídeo para processar o novo link do vídeo corretamente
      videoPlayer.load();
      playerBox.style.display = 'block';

      // Rola a página até o player suavemente
      playerBox.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
