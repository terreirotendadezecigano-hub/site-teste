<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tenda de Zé Cigano - Gestão e Informações</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #1A1415;
      --bg-card: #241D1D;
      --gold-primary: #D4AF37;
      --gold-light: #E5D3A1;
      --red-logo: #3D0C11;
      --red-logo-dark: #2B0E11;
      --red-btn: #C8102E;
      --blue-btn: #0047AB;
      --text-main: #FFFFFF;
      --text-muted: #E5D3A1;
      --border-color: rgba(212, 175, 55, 0.4);
    }

    * { box-sizing: border-box; }

    html, body { 
      background-color: var(--bg-primary); 
      color: var(--text-main); 
      width: 100%;
      min-height: 100vh;
      margin: 0 !important;
      padding: 0 !important;
      overflow-x: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* HEADER BANNER */
    header.banner {
      background: linear-gradient(135deg, var(--red-logo-dark) 0%, var(--red-logo) 50%, #1A0003 100%);
      border-bottom: 2px solid var(--gold-primary);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
    }

    .banner-brand { display: flex; align-items: center; gap: 12px; }
    .banner-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      object-fit: cover;
      background-color: #000;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
    }

    .banner-titles h1 { font-size: 1.1rem; color: var(--gold-primary); text-transform: uppercase; font-weight: 700; margin: 0; }
    .banner-titles p { font-size: 0.75rem; color: var(--gold-light); margin: 0; }

    .container { padding: 20px 16px; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* BOTÕES DE AÇÃO PRINCIPAIS NA PÁGINA */
    .btn-action {
      background: var(--gold-primary);
      color: #000;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action.btn-pdf-style {
      background: var(--gold-primary);
      color: #000;
    }

    /* TABELA PRINCIPAL */
    .table-responsive { width: 100%; overflow-x: auto; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; }
    .membros-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    .membros-table th, .membros-table td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
    .membros-table th { background-color: #1a1a1a; color: var(--gold-primary); font-weight: 600; }
    .pdf-print-obs { font-size: 0.8rem; color: #aaaaaa; font-style: italic; margin-top: 4px; display: block; }

    /* ============================================================
       ESTILIZAÇÃO MODERNA DOS MODAIS (CONFORME SOLICITADO E IMAGENS)
       ============================================================ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 12px;
    }

    .modal-container {
      background-color: var(--bg-primary);
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    .modal-header {
      background: linear-gradient(135deg, var(--red-logo-dark) 0%, var(--red-logo) 100%);
      padding: 16px 20px;
      border-bottom: 1px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-logo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      object-fit: cover;
    }

    .modal-header h3 {
      color: var(--gold-primary);
      font-size: 1.15rem;
      margin: 0;
      font-weight: 700;
      text-transform: uppercase;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--gold-light);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .modal-body {
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* GRID FORMULÁRIO RESPONSIVO */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .form-group-full { grid-column: span 2; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      color: var(--gold-light);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .form-control {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: #FFFFFF;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 1rem;
      min-height: 44px;
      outline: none;
      width: 100%;
    }

    .form-control:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
    }

    .modal-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #140E0F;
    }

    .btn-modal-primary {
      background-color: var(--red-btn);
      color: #FFFFFF;
      font-weight: bold;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      min-height: 44px;
      cursor: pointer;
      flex: 1;
      max-width: 200px;
    }

    .btn-modal-secondary {
      background-color: var(--blue-btn);
      color: #FFFFFF;
      font-weight: bold;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      min-height: 44px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-modal-cancel {
      background-color: transparent;
      color: var(--gold-light);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 6px;
      min-height: 44px;
      cursor: pointer;
    }

    /* ADAPTAÇÃO TOTAL PARA DISPOSITIVOS MÓVEIS (360px+) */
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group-full { grid-column: span 1; }
      .modal-container { height: 100%; max-height: 100vh; border-radius: 0; }
      .modal-footer { flex-direction: column-reverse; }
      .btn-modal-primary, .btn-modal-secondary, .btn-modal-cancel { width: 100%; max-width: 100%; }
    }

    /* CONFIGURAÇÃO EXCLUSIVA DE IMPRESSÃO DO RELATÓRIO PDF */
    @media print {
      @page { margin: 15mm; size: auto; }
      body, html { background: #ffffff !important; color: #000000 !important; font-family: Arial, sans-serif !important; }
      header.banner, .btn-action, .modal-overlay { display: none !important; }
      .container::before {
        content: "TENDA DE ZÉ CIGANO\A Relatório Interno de Cadastro";
        white-space: pre-wrap;
        display: block;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #60000a;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #d4af37;
      }
      .container { padding: 0 !important; max-width: 100% !important; }
      .table-responsive { border: none !important; overflow: visible !important; background: transparent !important; }
      .membros-table { width: 100% !important; border-collapse: collapse !important; }
      .membros-table th { background-color: #f2f2f2 !important; color: #000000 !important; font-size: 15px !important; border: 1px solid #999 !important; padding: 10px !important; }
      .membros-table td { font-size: 14px !important; line-height: 1.6 !important; color: #111 !important; border: 1px solid #ccc !important; padding: 10px !important; }
      .pdf-print-obs { font-size: 12px !important; color: #444 !important; font-style: italic !important; margin-top: 6px !important; display: block !important; }
    }
  </style>
</head>
<body>

  <!-- HEADER / BANNER -->
  <header class="banner">
    <div class="banner-brand">
      <img id="dynamicLogo" src="" alt="Logo Tenda de Zé Cigano" class="banner-logo">
      <div class="banner-titles">
        <h1 id="siteTitle">Tenda de Zé Cigano</h1>
        <p id="siteSubtitle">Terreiro de Umbanda</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- BOTÕES -->
    <button onclick="abrirModalMembro()" class="btn-action">
      <i class="fa-solid fa-user-plus"></i> Cadastrar Membro
    </button>
    
    <button onclick="window.print()" class="btn-action btn-pdf-style">
      <i class="fa-solid fa-file-pdf"></i> Salvar / Imprimir PDF
    </button>

    <!-- TABELA PRINCIPAL DE DADOS -->
    <div class="table-responsive">
      <table class="membros-table">
        <thead>
          <tr>
            <th>Nome / Item</th>
            <th>Categoria</th>
            <th>Detalhes & Observações</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo">
          <tr>
            <td><strong>Erva Doce</strong></td>
            <td>Ervas Fechadas</td>
            <td>Propriedades de calmaria, expansão magnética e harmonização do ambiente.
              <span class="pdf-print-obs">Obs: Utilizar em banhos de descarrego suave e defumações de prosperidade.</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- MODAL DE CADASTRO DE MEMBRO (FORMATADO) -->
  <div class="modal-overlay" id="modalMembro">
    <div class="modal-container">
      
      <div class="modal-header">
        <div class="modal-header-brand">
          <img src="" alt="Logo" class="modal-logo modalDynamicLogo">
          <h3>Cadastrar Membro</h3>
        </div>
        <button class="modal-close-btn" onclick="fecharModalMembro()">&times;</button>
      </div>

      <div class="modal-body">
        <form id="formCadastroMembro" class="form-grid">
          
          <div class="form-group form-group-full">
            <label>Nome Completo</label>
            <input type="text" class="form-control" name="Nome_Completo" placeholder="Digite o nome completo" required>
          </div>

          <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="date" class="form-control" name="Data_Nascimento">
          </div>

          <div class="form-group">
            <label>Telefone / WhatsApp</label>
            <input type="text" class="form-control" name="Telefone" placeholder="(00) 00000-0000">
          </div>

          <div class="form-group form-group-full">
            <label>E-mail</label>
            <input type="email" class="form-control" name="Email" placeholder="exemplo@email.com">
          </div>

          <div class="form-group form-group-full">
            <label>Endereço Completo</label>
            <input type="text" class="form-control" name="Endereco" placeholder="Rua, número, bairro, cidade - UF">
          </div>

          <div class="form-group">
            <label>RG</label>
            <input type="text" class="form-control" name="RG" placeholder="Número do RG">
          </div>

          <div class="form-group">
            <label>CPF</label>
            <input type="text" class="form-control" name="CPF" placeholder="000.000.000-00">
          </div>

          <div class="form-group form-group-full">
            <label>Escolaridade</label>
            <select class="form-control" name="Escolaridade">
              <option value="">Selecione...</option>
              <option value="Ensino Fundamental">Ensino Fundamental</option>
              <option value="Ensino Médio">Ensino Médio</option>
              <option value="Ensino Superior">Ensino Superior</option>
            </select>
          </div>

          <div class="form-group">
            <label>Situação Profissional</label>
            <input type="text" class="form-control" name="Situacao_Profissional">
          </div>

          <div class="form-group">
            <label>Profissão</label>
            <input type="text" class="form-control" name="Profissao">
          </div>

          <div class="form-group form-group-full">
            <label>Alergias / Problemas de Saúde</label>
            <input type="text" class="form-control" name="Alergias_Problemas_Saude" placeholder="Informe se possuir">
          </div>

          <div class="form-group form-group-full">
            <label>Foto do Membro</label>
            <button type="button" class="btn-modal-secondary" style="width: auto;">
              <i class="fa-solid fa-upload"></i> Escolher Arquivo
            </button>
          </div>

          <div class="form-group">
            <label>Status</label>
            <select class="form-control" name="Status_Ativo">
              <option value="Ativo">Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
          </div>

          <div class="form-group">
            <label>Cargo / Função</label>
            <input type="text" class="form-control" name="Cargo_Funcao" placeholder="Função na casa">
          </div>

        </form>
      </div>

      <div class="modal-footer">
        <button class="btn-modal-cancel" onclick="fecharModalMembro()">Cancelar</button>
        <button class="btn-modal-primary" onclick="salvarMembro()">Salvar Membro</button>
      </div>

    </div>
  </div>

  <script>
    // Substitua este parâmetro pelo URL publicado do seu Google Apps Script (Web App)
    const WEB_APP_URL = 'SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI';

    // BUSCA AUTOMÁTICA DA LOGO E DADOS INICIAIS DA ABA GERAL
    async function carregarDadosIniciais() {
      if (WEB_APP_URL === 'SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI') {
        // Fallback para exibição em teste local
        aplicarLogo("https://lh3.googleusercontent.com/d/1tTQCxsP8Z8H5mNnEFEfVq8dEg9VF0U1-");
        return;
      }

      try {
        const resposta = await fetch(`${WEB_APP_URL}?sheet=Geral`);
        const dados = await resposta.json();
        
        if (dados && dados.length > 0) {
          const configGeral = dados[0];
          if (configGeral.Logo_URL) {
            aplicarLogo(configGeral.Logo_URL);
          }
          if (configGeral.Nome_Terreiro) {
            document.getElementById('siteTitle').innerText = configGeral.Nome_Terreiro;
          }
          if (configGeral.Subtitulo) {
            document.getElementById('siteSubtitle').innerText = configGeral.Subtitulo;
          }
        }
      } catch (erro) {
        console.error("Erro ao carregar configurações do banco de dados:", erro);
      }
    }

    function aplicarLogo(urlLogo) {
      document.getElementById('dynamicLogo').src = urlLogo;
      document.querySelectorAll('.modalDynamicLogo').forEach(img => img.src = urlLogo);
    }

    // LÓGICA DE ABERTURA E FECHAMENTO DO MODAL
    function abrirModalMembro() {
      document.getElementById('modalMembro').style.display = 'flex';
    }

    function fecharModalMembro() {
      document.getElementById('modalMembro').style.display = 'none';
    }

    function salvarMembro() {
      alert("Ação de salvar acionada. Integre o envio ao Apps Script pelo endpoint doPost.");
      fecharModalMembro();
    }

    // Inicialização ao carregar a página
    window.addEventListener('DOMContentLoaded', carregarDadosIniciais);
  </script>
</body>
</html>
