<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenda de Zé Cigano - Sistema Integrado</title>
    <!-- Google Fonts & Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #7b1fa2;
            --secondary-color: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #2c003e, #121212);
            border-bottom: 2px solid var(--secondary-color);
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            color: var(--secondary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: #aaa;
            font-size: 0.9rem;
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        /* Estilização de Mídia Integrada (Áudio e Vídeo) */
        .media-container {
            margin: 8px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        audio {
            width: 100%;
            max-width: 280px;
            height: 36px;
            border-radius: 30px;
        }

        video {
            width: 100%;
            max-width: 220px;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
            background: #000;
            border: 1px solid var(--border-color);
        }

        .media-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--primary-color);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: background 0.2s;
            width: fit-content;
        }

        .media-link-btn:hover {
            background-color: #9c27b0;
        }

        /* Tabelas e Cards de Exibição */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #252525;
            color: var(--secondary-color);
            font-family: 'Cinzel', serif;
            font-weight: 600;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--secondary-color);
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #111;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tenda de Zé Cigano</h1>
        <p>Portal Oficial de Mídia e Conteúdos</p>
    </header>

    <main>
        <div id="conteudo-dinamico">
            <div class="loading">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Carregando dados e mídias...
            </div>
        </div>
    </main>

    <footer>
        &copy; Tenda de Zé Cigano - Todos os direitos reservados.
    </footer >

    <script>
        // URL do Web App do Google Apps Script (Certifique-se de que está publicada corretamente)
        const WEB_APP_URL = "SUA_URL_DO_WEB_APP_AQUI"; // Substitua caso necessário ou deixe dinâmico se já configurado

        async function carregarDadosAba(nomeAba = "Pontos_Cantados") {
            try {
                const response = await fetch(`${window.location.href.split('?')[0]}?action=read&sheet=${nomeAba}`);
                const data = await response.json();
                
                renderizarTabelaComMidias(data);
            } catch (error) {
                document.getElementById('conteudo-dinamico').innerHTML = `
                    <div style="text-align:center; padding: 30px; color: #ff6b6b;">
                        <i class="fa-solid fa-triangle-exclamation"></i> Erro ao carregar os dados. Verifique a conexão.
                    </div>`;
            }
        }

        function formatarValorCelula(coluna, valor) {
            if (!valor) return "-";
            
            const valorStr = String(valor).trim();
            const colunaUpper = coluna.toUpperCase();

            // Detecta se é um link gerado ou URL do Google Drive / Web
            const ehUrl = valorStr.startsWith("http://") || valorStr.startsWith("https://") || valorStr.includes("drive.google.com");

            if (ehUrl) {
                // Se for link de Áudio
                if (colunaUpper.includes("AUDIO") || colunaUpper.includes("SOM")) {
                    return `
                        <div class="media-container">
                            <audio controls preload="none">
                                <source src="${valorStr}" type="audio/mpeg">
                                Seu navegador não suporta áudio.
                            </audio>
                            <a href="${valorStr}" target="_blank" class="media-link-btn">
                                <i class="fa-solid fa-download"></i> Baixar Áudio
                            </a>
                        </div>`;
                }
                
                // Se for link de Vídeo ou Imagem em colunas de mídia
                if (colunaUpper.includes("VIDEO") || colunaUpper.includes("ARQUIVO_VIDEO")) {
                    return `
                        <div class="media-container">
                            <video controls preload="none">
                                <source src="${valorStr}" type="video/mp4">
                                Seu navegador não suporta vídeo.
                            </video>
                            <a href="${valorStr}" target="_blank" class="media-link-btn">
                                <i class="fa-solid fa-expand"></i> Abrir Vídeo
                            </a>
                        </div>`;
                }

                if (colunaUpper.includes("IMAGEM") || colunaUpper.includes("FOTO") || colunaUpper.includes("_URL")) {
                    // Se for imagem direta
                    if (valorStr.match(/\.(jpeg|jpg|png|webp|gif)$/i) || colunaUpper.includes("IMAGEM")) {
                        return `
                            <div class="media-container">
                                <a href="${valorStr}" target="_blank">
                                    <img src="${valorStr}" alt="Mídia" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #444;">
                                </a>
                            </div>`;
                    }
                }

                // Link genérico formatado
                return `<a href="${valorStr}" target="_blank" class="media-link-btn"><i class="fa-solid fa-link"></i> Acessar Link</a>`;
            }

            return valorStr;
        }

        function renderizarTabelaComMidias(dados) {
            const container = document.getElementById('conteudo-dinamico');
            
            if (!dados || dados.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding: 20px;">Nenhum registro encontrado.</p>';
                return;
            }

            // Pega as chaves (colunas) do primeiro objeto
            const colunas = Object.keys(dados[0]);

            let html = '<div class="table-responsive"><table><thead><tr>';
            colunas.forEach(col => {
                html += `<th>${col.replace(/_/g, ' ')}</th>`;
            });
            html += '</tr></thead><tbody>';

            dados.forEach(linha => {
                html += '<tr>';
                colunas.forEach(col => {
                    let valorFormatado = formatarValorCelula(col, linha[col]);
                    html += `<td>${valorFormatado}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        // Inicializa buscando a aba de Pontos Cantados ou Mural por padrão
        window.onload = function() {
            carregarDadosAba("Pontos_Cantados"); // Altere para a aba desejada se necessário
        };
    </script>
</body>
</html>
