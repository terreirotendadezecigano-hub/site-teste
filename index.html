<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenda de Zé Cigano</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-card: #141414;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #2a2a2a;
    }

    html, body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: #000;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-box h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .title-box p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Container Principal */
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* Barra de Pesquisa */
    .search-container {
      margin-bottom: 20px;
      position: relative;
    }

    .search-container i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--gold-primary);
    }

    /* Cartões e Seções */
    .section-title {
      color: var(--gold-primary);
      font-size: 1.1rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .membros-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .membro-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s;
    }

    .membro-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-primary);
    }

    .membro-card h3 {
      margin: 0 0 5px 0;
      font-size: 1rem;
      color: var(--gold-light);
    }

    .membro-card p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Estado de Carregamento e Sem Resultados */
    .loading-box, .no-results {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
    }

    .loading-box i {
      font-size: 2rem;
      color: var(--gold-primary);
      margin-bottom: 10px;
    }

    .btn-membros {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="logo-container">
      <div class="title-box">
        <h1>Tenda de Zé Cigano</h1>
        <p>Terreiro de Umbanda</p>
      </div>
    </div>
    
    <!-- Área do Usuário: Garantido que inicia deslogado -->
    <div id="userArea">
      <button class="btn-membros" onclick="fazerLogin()"><i class="fa-solid fa-lock"></i> Membros</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Campo de Pesquisa de Membros / Filhos de Santo -->
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input 
        type="text" 
        id="inputPesquisa" 
        class="search-input" 
        placeholder="Pesquisar filho de santo por nome ou cargo..."
        onkeyup="filtrarMembros()"
      >
    </div>

    <!-- Seção Principal de Membros -->
    <div class="section-title">
      <i class="fa-solid fa-users"></i>
      <span>Filhos de Santo & Membros</span>
    </div>

    <!-- Indicador de Carregamento -->
    <div id="loadingStatus" class="loading-box">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <p>Buscando dados...</p>
    </div>

    <!-- Grid onde a lista de membros é exibida -->
    <div id="membrosGrid" class="membros-grid" style="display: none;"></div>

    <!-- Mensagem caso nenhum membro seja encontrado no filtro -->
    <div id="mensagemVazia" class="no-results" style="display: none;">
      <p>Nenhum filho de santo encontrado com essa pesquisa.</p>
    </div>

  </div>

  <script>
    // 1. GARANTIR QUE INICIA SEM NINGUÉM LOGADO
    let usuarioLogado = null; 
    localStorage.removeItem('usuarioSessao'); // Limpa qualquer sessão salva anteriormente

    // Dados de exemplo (Substitua pela chamada da sua API/Firebase)
    const listaMembrosExemplo = [
      { id: 1, nome: "Pai Zé", cargo: "Sacerdote" },
      { id: 2, nome: "Maria de Oxum", cargo: "Filha de Santo" },
      { id: 3, nome: "João de Ogum", cargo: "Filho de Santo" },
      { id: 4, nome: "Carlos de Oxóssi", cargo: "Cambone" },
      { id: 5, nome: "Ana de Iemanjá", cargo: "Filha de Santo" }
    ];

    // 2. FUNÇÃO PARA CARREGAR OS DADOS
    function carregarDados() {
      // Simula uma requisição assíncrona (como do Firebase ou Fetch)
      setTimeout(() => {
        renderizarMembros(listaMembrosExemplo);
        
        // Esconde o "Buscando dados..." e exibe o grid
        document.getElementById('loadingStatus').style.display = 'none';
        document.getElementById('membrosGrid').style.display = 'grid';
      }, 1000);
    }

    // 3. FUNÇÃO PARA RENDERIZAR OS MEMBROS NO HTML
    function renderizarMembros(membros) {
      const grid = document.getElementById('membrosGrid');
      grid.innerHTML = '';

      membros.forEach(membro => {
        const card = document.createElement('div');
        card.className = 'membro-card';
        card.innerHTML = `
          <h3>${membro.nome}</h3>
          <p>${membro.cargo}</p>
        `;
        grid.appendChild(card);
      });
    }

    // 4. FUNÇÃO DE FILTRO/PESQUISA EM TEMPO REAL
    function filtrarMembros() {
      const termo = document.getElementById('inputPesquisa').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.membro-card');
      let encontrouAlgum = false;

      cards.forEach(card => {
        const textoCard = card.textContent.toLowerCase();
        if (textoCard.includes(termo)) {
          card.style.display = 'block';
          encontrouAlgum = true;
        } else {
          card.style.display = 'none';
        }
      });

      // Exibe mensagem caso a busca não retorne resultados
      const mensagemVazia = document.getElementById('mensagemVazia');
      if (!encontrouAlgum) {
        mensagemVazia.style.display = 'block';
      } else {
        mensagemVazia.style.display = 'none';
      }
    }

    // 5. FUNÇÃO DE LOGIN
    function fazerLogin() {
      alert("Abre a tela/modal de login para autenticação.");
    }

    // Inicializa a busca de dados assim que a página carrega
    window.onload = carregarDados;
  </script>
</body>
</html>
