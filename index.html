<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amostra de Layout - Tenda de Zé Cigano</title>
  <style>
    /* Estilo do Fundo e Container Geral */
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* Estrutura da Modal Refatorada */
    .modal-sample {
      background-color: #141414;
      border: 1px solid #333333;
      border-radius: 8px;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.9);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }

    .modal-header {
      background-color: #1a1a1a;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      color: #f3d45a;
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0;
    }

    .modal-close {
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      color: #d1d1d1;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      background-color: #222222;
      border: 1px solid #3d3d3d;
      color: #f0f0f0;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.9rem;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      background-color: #282828;
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
      outline: none;
    }

    .modal-footer {
      background-color: #1a1a1a;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px 24px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* Botões */
    .btn-secondary {
      background-color: #202020;
      border: 1px solid #3d3d3d;
      color: #cccccc;
      border-radius: 5px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-secondary:hover {
      background-color: #2e2e2e;
      color: #ffffff;
    }

    .btn-primary {
      background-color: #d4af37;
      border: 1px solid #d4af37;
      color: #000000;
      border-radius: 5px;
      padding: 8px 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #ffe173;
      border-color: #ffe173;
    }
  </style>
</head>
<body>

  <div class="modal-sample">
    <div class="modal-header">
      <h3 class="modal-title">📿 Cadastrar Banho da Semana</h3>
      <span class="modal-close">✕</span>
    </div>
    
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Tipo *</label>
          <select>
            <option>Banho da Semana</option>
          </select>
        </div>
        <div class="form-group">
          <label>Data da publicação</label>
          <input type="text" value="02/10/2026">
        </div>
      </div>

      <div class="form-group">
        <label>Título *</label>
        <input type="text" placeholder="Ex: Banho de Manjericão e Alecrim">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Ingredientes</label>
          <textarea rows="3" placeholder="Digite os ingredientes..."></textarea>
        </div>
        <div class="form-group">
          <label>Modo de preparo</label>
          <textarea rows="3" placeholder="Digite o modo de preparo..."></textarea>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary">✕ Fechar</button>
      <button class="btn-primary">💾 Salvar</button>
    </div>
  </div>

</body>
</html>
