<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tenda de Zé Cigano - Cadastro de Membros</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-card: #141414;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #2a2a2a;
    }

    html, body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    header {
      background: var(--bg-card);
      padding: 25px 20px;
      text-align: center;
      border-bottom: 2px solid var(--gold-primary);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    h1 { 
      color: var(--gold-primary); 
      margin: 0; 
      font-size: 1.6rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
    }

    .form-card h2 {
      color: var(--gold-primary);
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 1.3rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-group { margin-bottom: 15px; }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--gold-light);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--gold-primary);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold-primary), #aa8625);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-submit:hover { 
      background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
    }

    .status-msg {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .oculto { display: none; }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-sair {
      background: #8b0000;
      color: #fff;
      border: 1px solid #ff4d4d;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.3s;
    }

    .btn-sair:hover {
      background: #b30000;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fas fa-star"></i> Tenda de Zé Cigano</h1>
  </header>

  <div class="container">
    
    <!-- TELA DE ACESSO -->
    <div id="secaoLogin" class="form-card" style="max-width: 400px; margin: 0 auto;">
      <h2><i class="fas fa-key"></i> Acesso</h2>
      <form id="formLogin">
        <div class="form-group">
          <label for="loginEmail">E-mail de Acesso:</label>
          <input type="email" id="loginEmail" placeholder="seuemail@gmail.com" required>
        </div>
        <button type="submit" id="btnLogin" class="btn-submit">Entrar</button>
      </form>
      <div id="statusLogin" class="status-msg"></div>
    </div>

    <!-- PÁGINA DE CADASTRO DE MEMBROS -->
    <div id="secaoCadastro" class="form-card oculto">
      <div class="user-bar">
        <span>Usuário: <b id="nomeUsuario" style="color: var(--gold-light);"></b></span>
        <button id="btnSair" class="btn-sair"><i class="fas fa-sign-out-alt"></i> Sair</button>
      </div>

      <h2><i class="fas fa-user-plus"></i> Cadastro de Membros</h2>

      <form id="formCadastroMembro">
        <div class="form-grid">
          
          <div class="form-group full-width">
            <label for="cadNome">Nome Completo *</label>
            <input type="text" id="cadNome" placeholder="Digite o nome completo" required>
          </div>

          <div class="form-group">
            <label for="cadNascimento">Data de Nascimento</label>
            <input type="date" id="cadNascimento">
          </div>

          <div class="form-group">
            <label for="cadTelefone">Telefone / WhatsApp *</label>
            <input type="tel" id="cadTelefone" placeholder="(31) 99999-9999" required>
          </div>

          <div class="form-group full-width">
            <label for="cadEmail">E-mail</label>
            <input type="email" id="cadEmail" placeholder="membro@email.com">
          </div>

          <div class="form-group full-width">
            <label for="cadEndereco">Endereço Completo</label>
            <input type="text" id="cadEndereco" placeholder="Rua, número, bairro">
          </div>

          <div class="form-group">
            <label for="cadEntrada">Data de Entrada</label>
            <input type="date" id="cadEntrada">
          </div>

          <div class="form-group">
            <label for="cadCargo">Cargo / Função</label>
            <input type="text" id="cadCargo" placeholder="Ex: Filho(a), Pai de Santo">
          </div>

          <div class="form-group">
            <label for="cadOrixa">Orixá de Frente</label>
            <input type="text" id="cadOrixa" placeholder="Ex: Ogum, Oxum">
          </div>

          <div class="form-group">
            <label for="cadStatus">Status Ativo *</label>
            <select id="cadStatus">
              <option value="Ativo" selected>Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
          </div>

          <div class="form-group">
            <label for="cadPerfil">Perfil no Sistema *</label>
            <select id="cadPerfil">
              <option value="Filho(a)" selected>Filho(a)</option>
              <option value="Dirigente">Dirigente</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="cadObs">Observações</label>
            <textarea id="cadObs" rows="3" placeholder="Informações adicionais..."></textarea>
          </div>

        </div>

        <button type="submit" id="btnSalvarMembro" class="btn-submit">
          Salvar Membro
        </button>
      </form>

      <div id="statusCadastro" class="status-msg"></div>
    </div>

  </div>

  <script>
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbyFje_ocF7a0S7Tq4EYQmM5W3hv9SmHZqxJmWLhPKdkVfudzW-Q3EEbM66U9BiwdBZOJw/exec';

    // 1. LÓGICA DE LOGIN
    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();

      const emailInput = document.getElementById('loginEmail').value.trim();
      const statusLogin = document.getElementById('statusLogin');
      const btnLogin = document.getElementById('btnLogin');

      btnLogin.disabled = true;
      statusLogin.style.color = '#e0a800';
      statusLogin.innerText = '⏳ Verificando...';

      fetch(`${URL_APPS_SCRIPT}?email=${encodeURIComponent(emailInput)}`)
        .then(res => res.json())
        .then(data => {
          if (data.autorizado) {
            statusLogin.style.color = '#28a745';
            statusLogin.innerText = '✅ Sucesso!';
            
            setTimeout(() => {
              document.getElementById('secaoLogin').classList.add('oculto');
              document.getElementById('secaoCadastro').classList.remove('oculto');
              document.getElementById('nomeUsuario').innerText = data.nome;
              document.getElementById('cadEntrada').valueAsDate = new Date();
            }, 600);
          } else {
            statusLogin.style.color = '#dc3545';
            statusLogin.innerText = '❌ ' + data.mensagem;
            btnLogin.disabled = false;
          }
        })
        .catch(err => {
          console.error(err);
          statusLogin.style.color = '#dc3545';
          statusLogin.innerText = '❌ Erro de conexão.';
          btnLogin.disabled = false;
        });
    });

    // 2. SAIR
    document.getElementById('btnSair').addEventListener('click', function() {
      document.getElementById('secaoCadastro').classList.add('oculto');
      document.getElementById('secaoLogin').classList.remove('oculto');
      document.getElementById('formLogin').reset();
      document.getElementById('statusLogin').innerText = '';
      document.getElementById('btnLogin').disabled = false;
    });

    // 3. GRAVAÇÃO COMPLETA NA TABELA CADASTRO_FILHOS
    document.getElementById('formCadastroMembro').addEventListener('submit', function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSalvarMembro');
      const status = document.getElementById('statusCadastro');

      const nome = document.getElementById('cadNome').value.trim();
      const nascimento = document.getElementById('cadNascimento').value;
      const telefone = document.getElementById('cadTelefone').value.trim();
      const email = document.getElementById('cadEmail').value.trim();
      const endereco = document.getElementById('cadEndereco').value.trim();
      const entrada = document.getElementById('cadEntrada').value;
      const cargo = document.getElementById('cadCargo').value.trim();
      const orixa = document.getElementById('cadOrixa').value.trim();
      const statusAtivo = document.getElementById('cadStatus').value;
      const perfil = document.getElementById('cadPerfil').value;
      const obs = document.getElementById('cadObs').value.trim();

      const formatarData = (dt) => dt ? dt.split('-').reverse().join('/') : "";

      btn.disabled = true;
      btn.style.opacity = '0.6';
      status.style.color = '#e0a800';
      status.innerText = '⏳ Salvando membro...';

      const idGerado = Math.random().toString(36).substring(2, 9);

      const payload = {
        nomeAba: "Cadastro_Filhos",
        valores: [
          idGerado,                     // Coluna A: ID_Filho
          nome,                         // Coluna B: Nome_Completo
          formatarData(nascimento),     // Coluna C: Data_Nascimento
          telefone,                     // Coluna D: Telefone
          email,                        // Coluna E: Email
          endereco,                     // Coluna F: Endereco
          formatarData(entrada),        // Coluna G: Data_Entrada
          cargo,                        // Coluna H: Cargo_Funcao
          orixa,                        // Coluna I: Orixa_Frente
          statusAtivo,                  // Coluna J: Status_Ativo
          perfil,                       // Coluna K: Perfil
          obs                           // Coluna L: Observacoes
        ]
      };

      fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        status.style.color = '#28a745';
        status.innerText = '✅ Membro cadastrado com sucesso!';
        document.getElementById('formCadastroMembro').reset();
        document.getElementById('cadEntrada').valueAsDate = new Date();
      })
      .catch(err => {
        console.error(err);
        status.style.color = '#dc3545';
        status.innerText = '❌ Erro ao cadastrar. Tente novamente.';
      })
      .finally(() => {
        btn.disabled = false;
        btn.style.opacity = '1';
      });
    });
  </script>
</body>
</html>
