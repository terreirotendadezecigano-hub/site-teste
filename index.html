<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tenda de Zé Cigano - Testes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-card: #141414;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --red-logo: #800000;
      --red-logo-dark: #3a0005;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #2a2a2a;
    }

    html, body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: var(--bg-card);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid var(--gold-primary);
    }

    h1 {
      color: var(--gold-primary);
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .form-card h2 {
      color: var(--gold-primary);
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--gold-primary);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--gold-primary);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: var(--gold-light);
    }

    #statusCadastro {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fas fa-star"></i> Tenda de Zé Cigano</h1>
    <p style="color: var(--text-muted); margin-top: 5px;">Ambiente de Testes</p>
  </header>

  <div class="container">
    <div class="form-card">
      <h2><i class="fas fa-user-plus"></i> Cadastro de Filho da Casa</h2>

      <form id="formCadastroMembro">
        <div class="form-group">
          <label for="cadNome">Nome Completo:</label>
          <input type="text" id="cadNome" placeholder="Digite o nome completo" required>
        </div>

        <div class="form-group">
          <label for="cadTelefone">Telefone / WhatsApp:</label>
          <input type="tel" id="cadTelefone" placeholder="(31) 99999-9999" required>
        </div>

        <div class="form-group">
          <label for="cadEmail">E-mail:</label>
          <input type="email" id="cadEmail" placeholder="exemplo@email.com">
        </div>

        <button type="submit" id="btnSalvarMembro" class="btn-submit">
          Salvar na Planilha
        </button>
      </form>

      <div id="statusCadastro"></div>
    </div>
  </div>

  <script>
    // URL configurada do seu Google Apps Script
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbyFje_ocF7a0S7Tq4EYQmM5W3hv9SmHZqxJmWLhPKdkVfudzW-Q3EEbM66U9BiwdBZOJw/exec';

    document.getElementById('formCadastroMembro').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSalvarMembro');
      const status = document.getElementById('statusCadastro');

      const nome = document.getElementById('cadNome').value.trim();
      const telefone = document.getElementById('cadTelefone').value.trim();
      const email = document.getElementById('cadEmail').value.trim();

      btn.disabled = true;
      btn.style.opacity = '0.6';
      status.style.color = '#e0a800';
      status.innerText = '⏳ Salvando cadastro na planilha...';

      // Gera um ID aleatório simples para a Coluna A (ex: ID_Filho)
      const idGerado = Math.random().toString(36).substring(2, 9);
      const dataHoje = new Date().toLocaleDateString('pt-BR');

      // Mapeamento correto para as colunas da aba Cadastro_Filhos
      const payload = {
        nomeAba: "Cadastro_Filhos",
        valores: [
          idGerado,   // Coluna A: ID_Filho
          nome,       // Coluna B: Nome_Completo
          "",         // Coluna C: Data_Nascimento (vazio por enquanto)
          telefone,   // Coluna D: Telefone
          email,      // Coluna E: Email
          "",         // Coluna F: Endereco
          dataHoje,   // Coluna G: Data_Entrada
          "",         // Coluna H: Cargo_Funcao
          "",         // Coluna I: Orixa_Frente
          "Ativo"     // Coluna J: Status_Ativo
        ]
      };

      try {
        await fetch(https://script.google.com/macros/s/AKfycbyFje_ocF7a0S7Tq4EYQmM5W3hv9SmHZqxJmWLhPKdkVfudzW-Q3EEbM66U9BiwdBZOJw/exec, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        status.style.color = '#28a745';
        status.innerText = '✅ Membro cadastrado com sucesso na planilha!';
        document.getElementById('formCadastroMembro').reset();
      } catch (err) {
        console.error("Erro no cadastro:", err);
        status.style.color = '#dc3545';
        status.innerText = '❌ Erro ao enviar dados. Tente novamente.';
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
