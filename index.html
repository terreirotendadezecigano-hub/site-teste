<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenda de Zé Cigano</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-card: #141414;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --red-logo: #60000a;
      --red-logo-dark: #3a0005;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #2a2a2a;
    }

    html, body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      width: 100%;
      min-height: 100vh;
      margin: 0 !important;
      padding: 0 !important;
      overflow-x: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    /* Topo do Site */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: #000000;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title h1 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .brand-title p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-membros-top {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .main-container {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Barra de Pesquisa */
    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      padding: 10px 10px 10px 38px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--gold-primary);
    }

    /* Grid de Cartões */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 15px;
      position: relative;
    }

    .card h3 {
      margin: 0 0 8px 0;
      font-size: 1rem;
      color: var(--gold-primary);
    }

    .card p {
      margin: 4px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--gold-light);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-action:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    /* Modal Overlay (Layout Estético Original) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .modal-body {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 90%;
      max-width: 450px;
      padding: 20px;
    }

    .modal-body h3 {
      margin-top: 0;
      color: var(--gold-primary);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .form-control {
      margin-bottom: 15px;
    }

    .form-control label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-control input {
      width: 100%;
      padding: 8px 10px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-salvar {
      background-color: var(--gold-primary);
      color: #000000;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-fechar {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="brand">
      <div class="brand-title">
        <h1>Tenda de Zé Cigano</h1>
        <p>Terreiro de Umbanda</p>
      </div>
    </div>
    
    <!-- Área do Botão de Membros (Garantido iniciar Deslogado) -->
    <div id="userHeaderArea">
      <button class="btn-membros-top" onclick="abrirLogin()">
        <i class="fa-solid fa-lock"></i> Membros
      </button>
    </div>
  </header>

  <div class="main-container">

    <!-- Campo de Pesquisa -->
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input 
        type="text" 
        id="inputPesquisa" 
        placeholder="Pesquisar..." 
        onkeyup="filtrarMembros()"
      >
    </div>

    <!-- Grid onde ficam os Membros / Filhos de Santo -->
    <div id="gridMembros" class="cards-grid"></div>

  </div>

  <!-- Modal de Edição de Membro -->
  <div id="modalEditar" class="modal-overlay">
    <div class="modal-body">
      <h3>Editar Filho de Santo</h3>
      <form id="formEdicao" onsubmit="salvarEdicao(event)">
        <input type="hidden" id="editMembroId">

        <div class="form-control">
          <label for="editMembroNome">Nome do Membro</label>
          <input type="text" id="editMembroNome" required>
        </div>

        <div class="form-control">
          <label for="editMembroCargo">Cargo / Função</label>
          <input type="text" id="editMembroCargo" required>
        </div>

        <div class="form-control">
          <label for="editMembroContato">Contato / Telefone</label>
          <input type="text" id="editMembroContato">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-fechar" onclick="fecharModalEdicao()">Cancelar</button>
          <button type="submit" class="btn-salvar">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // =================================================================
    // 1. DESCONECTAR USUÁRIO AUTOMATICAMENTE AO CARREGAR A PÁGINA
    // =================================================================
    window.addEventListener('DOMContentLoaded', () => {
      // Limpa dados de sessão salvos
      localStorage.clear();
      sessionStorage.clear();

      // Desconecta sessão do Firebase se estiver ativo
      if (typeof firebase !== 'undefined' && firebase.auth) {
        firebase.auth().signOut().catch(err => console.error(err));
      }

      // Renderiza a lista de membros inicial
      renderizarMembros(listaMembros);
    });

    // =================================================================
    // 2. BASE DE DADOS DOS MEMBROS
    // =================================================================
    let listaMembros = [
      { id: "1", nome: "João de Ogum", cargo: "Filho de Santo", contato: "(31) 99999-0001" },
      { id: "2", nome: "Maria de Oxum", cargo: "Filha de Santo", contato: "(31) 99999-0002" },
      { id: "3", nome: "Carlos de Oxóssi", cargo: "Cambone", contato: "(31) 99999-0003" },
      { id: "4", nome: "Ana de Iemanjá", cargo: "Filha de Santo", contato: "(31) 99999-0004" }
    ];

    function renderizarMembros(membros) {
      const grid = document.getElementById('gridMembros');
      grid.innerHTML = '';

      membros.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card membro-card';
        card.innerHTML = `
          <h3>${m.nome}</h3>
          <p><strong>Cargo:</strong> ${m.cargo}</p>
          <p><strong>Contato:</strong> ${m.contato}</p>
          <div class="card-actions">
            <button class="btn-action" onclick="abrirEdicaoMembro('${m.id}')">
              <i class="fa-solid fa-pen"></i> Editar
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // =================================================================
    // 3. BARRA DE PESQUISA (FILTRO EM TEMPO REAL)
    // =================================================================
    function filtrarMembros() {
      const termo = document.getElementById('inputPesquisa').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.membro-card');

      cards.forEach(card => {
        const texto = card.textContent.toLowerCase();
        if (texto.includes(termo)) {
          card.style.display = "block";
        } else {
          card.style.display = "none";
        }
      });
    }

    // =================================================================
    // 4. PREENCHER DADOS AUTOMATICAMENTE AO CLICAR EM EDITAR
    // =================================================================
    function abrirEdicaoMembro(id) {
      // Localiza o membro selecionado pelo ID
      const membro = listaMembros.find(m => m.id === String(id));

      if (membro) {
        // Preenche os campos do formulário com as informações do membro
        document.getElementById('editMembroId').value = membro.id;
        document.getElementById('editMembroNome').value = membro.nome;
        document.getElementById('editMembroCargo').value = membro.cargo;
        document.getElementById('editMembroContato').value = membro.contato;

        // Abre o modal de edição
        document.getElementById('modalEditar').style.display = 'flex';
      }
    }

    function fecharModalEdicao() {
      document.getElementById('modalEditar').style.display = 'none';
    }

    function salvarEdicao(e) {
      e.preventDefault();

      const id = document.getElementById('editMembroId').value;
      const membro = listaMembros.find(m => m.id === String(id));

      if (membro) {
        membro.nome = document.getElementById('editMembroNome').value;
        membro.cargo = document.getElementById('editMembroCargo').value;
        membro.contato = document.getElementById('editMembroContato').value;

        // Atualiza a exibição na tela
        renderizarMembros(listaMembros);
        filtrarMembros();
        fecharModalEdicao();
      }
    }

    function abrirLogin() {
      alert("Abre o formulário de login.");
    }
  </script>
</body>
</html>
