<!-- Seção: Coletânea de Pontos Cantados -->
<div class="container-pontos-cantados">
    
    <!-- Cabeçalho / Estilo Guia Sagrado -->
    <div class="card-guia-sagrado">
        <h2>Coletânea de Pontos Cantados</h2>
        <p class="subtitulo-guia">Selecione a Linha / Entidade</p>
        <p class="descricao-instrucao">Escolha abaixo a linha espiritual para visualizar os pontos sagrados correspondentes:</p>
        
        <!-- Filtro por Linha / Entidade -->
        <div class="filtro-container">
            <select id="filtroLinhaEntidade" class="select-guia-sagrado" onchange="filtrarPontosPorLinha()">
                <option value="">Todas as Linhas e Entidades</option>
                <!-- As opções serão populadas dinamicamente ou podem ser fixas conforme seu banco -->
                <option value="Exu">Linha de Exu</option>
                <option value="Pombagira">Linha de Pombagira</option>
                <option value="PretoVelho">Linha de Preto Velho</option>
                <option value="Caboclo">Linha de Caboclo</option>
                <option value="Baiano">Linha de Baianos</option>
            </select>
        </div>
    </div>

    <!-- Container onde os dados dos pontos serão carregados -->
    <div id="listaPontosContainer" class="grid-pontos">
        <!-- Os cards dos pontos serão injetados aqui pelo script -->
    </div>

</div>

<!-- Estilização inspirada no Guia Sagrado -->
<style>
    .container-pontos-cantados {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card-guia-sagrado {
        background: #fdfbf7;
        border: 2px solid #d4af37;
        border-radius: 12px;
        padding: 25px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        margin-bottom: 30px;
    }
    .card-guia-sagrado h2 {
        color: #2c2c2c;
        margin-bottom: 10px;
    }
    .subtitulo-guia {
        font-size: 1.2rem;
        font-weight: 600;
        color: #4a4a4a;
    }
    .descricao-instrucao {
        font-size: 0.95rem;
        color: #666;
        margin-bottom: 20px;
    }
    .select-guia-sagrado {
        padding: 12px 20px;
        font-size: 1rem;
        border: 1px solid #d4af37;
        border-radius: 8px;
        background-color: #fff;
        color: #333;
        width: 100%;
        max-width: 400px;
        cursor: pointer;
    }
    .grid-pontos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
    }
    .card-ponto-item {
        background: #fff;
        border-left: 5px solid #d4af37;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        transition: transform 0.2s ease;
    }
    .card-ponto-item:hover {
        transform: translateY(-3px);
    }
    /* Padrão de descrição destacada em cada função */
    .descricao-destacada {
        background-color: #f9f6ee;
        border-left: 3px solid #b8860b;
        padding: 10px 15px;
        font-style: italic;
        color: #555;
        margin-bottom: 12px;
        border-radius: 0 6px 6px 0;
    }
    .ponto-titulo {
        font-size: 1.1rem;
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
    }
    .ponto-letra {
        white-space: pre-line;
        color: #444;
        font-size: 0.95rem;
        line-height: 1.5;
    }
</style>

<!-- Script Corrigido para Carregamento e Filtragem -->
<script>
    /**
     * Função: carregarDadosPontos
     * Descrição destacada: Responsável por buscar e inicializar os dados dos pontos cantados na página, 
     * garantindo o preenchimento correto do container visual sem falhas de carregamento.
     */
    let todosOsPontos = []; // Array global para armazenar os dados carregados

    async function carregarDadosPontos() {
        try {
            // Substitua pelo seu endpoint real ou fonte de dados (ex: API, arquivo JSON ou array local)
            // Exemplo simulado de dados estruturados por linha/entidade:
            const resposta = await fetch('sua-api-ou-arquivo-de-pontos.json'); 
            
            // Caso esteja usando dados locais estáticos para teste, substitua o fetch pelo array abaixo:
            todosOsPontos = await resposta.json();
            
            // Renderiza todos inicialmente
            renderizarPontos(todosOsPontos);
        } catch (erro) {
            console.error("Erro ao carregar os pontos cantados:", erro);
            
            // Fallback de segurança para garantir que a página nunca fique vazia
            todosOsPontos = obterPontosExemplo();
            renderizarPontos(todosOsPontos);
        }
    }

    /**
     * Função: renderizarPontos
     * Descrição destacada: Responsável por construir dinamicamente os elementos HTML (cards) 
     * de cada ponto cantado e injetá-los de forma limpa no DOM da página.
     */
    function renderizarPontos(pontos) {
        const container = document.getElementById('listaPontosContainer');
        container.innerHTML = '';

        if (!pontos || pontos.length === 0) {
            container.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #666;">Nenhum ponto encontrado para esta seleção.</p>';
            return;
        }

        pontos.forEach(ponto => {
            const card = document.createElement('div');
            card.className = 'card-ponto-item';
            
            card.innerHTML = `
                <div class="ponto-titulo">${ponto.titulo}</div>
                <div class="descricao-destacada">Linha: ${ponto.linhaEntidade}</div>
                <div class="ponto-letra">${ponto.letra}</div>
            `;
            container.appendChild(card);
        });
    }

    /**
     * Função: filtrarPontosPorLinha
     * Descrição destacada: Responsável por filtrar a listagem de pontos cantados com base 
     * na Linha ou Entidade selecionada no elemento select do Guia Sagrado.
     */
    function filtrarPontosPorLinha() {
        const linhaSelecionada = document.getElementById('filtroLinhaEntidade').value;
        
        if (!linhaSelecionada) {
            renderizarPontos(todosOsPontos);
            return;
        }

        const pontosFiltrados = todosOsPontos.filter(ponto => 
            ponto.linhaEntidade.toLowerCase() === linhaSelecionada.toLowerCase()
        );

        renderizarPontos(pontosFiltrados);
    }

    // Dados de exemplo caso precise testar imediatamente
    function obterPontosExemplo() {
        return [
            { titulo: ".Ponto de Exu Exemplo", linhaEntidade: "Exu", letra: "Laroyê Exu...\nÊ mojubá a sua banda!" },
            { titulo: "Ponto de Pombagira Exemplo", linhaEntidade: "Pombagira", letra: "Saravá Pombagira da encruza...\nEla é Rainha!" },
            { titulo: "Ponto de Preto Velho Exemplo", linhaEntidade: "PretoVelho", letra: "A benção meu Pai Preto Velho...\nNa aruandaê..." }
        ];
    }

    // Executa o carregamento assim que o DOM estiver pronto
    document.addEventListener('DOMContentLoaded', carregarDadosPontos);
</>
