<!-- Exemplo de Estrutura do Modal Ajustada -->
<div id="modal-detalhes" class="modal" style="display: none;">
    <div class="modal-conteudo">
        <span class="botao-fechar" onclick="fecharModal()">&times;</span>
        
        <!-- Título -->
        <h2 id="modal-titulo">Título do Item</h2>
        
        <!-- Mídia (Vídeo do YouTube ou Imagem) -->
        <div id="modal-midia-container">
            <!-- Se for Ponto Cantado, injetamos o iframe do YouTube dinamicamente -->
            <!-- Se for Aviso, injetamos apenas a imagem limpa, sem o texto do caminho -->
        </div>

        <!-- Informações visíveis permitidas -->
        <p><strong>Categoria:</strong> <span id="modal-categoria"></span></p>
        <p><strong>Data de Criação:</strong> <span id="modal-data"></span></p>
        
        <!-- O CAMPO "Arquivo Imagem" FOI REMOVIDO DAQUI PARA OCULTAR O LINK -->

        <!-- Letra ou Texto Descritivo -->
        <div id="modal-texto"></div>
        
        <button onclick="fecharModal()">Fechar</button>
    </div>
</div>

<script>
    // Função para abrir o modal de Avisos (Ocultando o caminho do arquivo)
    function abrirAviso(item) {
        document.getElementById('modal-titulo').innerText = item.titulo;
        document.getElementById('modal-categoria').innerText = item.categoria;
        document.getElementById('modal-data').innerText = item.dataCriacao;
        
        // Exibe apenas a imagem, sem expor a string do diretório no texto visual
        document.getElementById('modal-midia-container').innerHTML = 
            `<img src="${item.caminhoImagem}" alt="${item.titulo}" style="max-width:100%;">`;
            
        document.getElementById('modal-detalhes').style.display = 'block';
    }

    // Função para abrir o modal de Pontos Cantados (Corrigindo o carregamento do YouTube)
    function abrirPontoCantado(ponto) {
        document.getElementById('modal-titulo').innerText = ponto.titulo;
        
        // Garante que o link do YouTube seja transformado em um Embed válido
        let embedUrl = ponto.linkYoutube.includes("watch?v=") 
            ? ponto.linkYoutube.replace("watch?v=", "embed/") 
            : ponto.linkYoutube;

        document.getElementById('modal-midia-container').innerHTML = `
            <iframe width="100%" height="315" src="${embedUrl}" 
                title="YouTube video player" frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>`;

        document.getElementById('modal-texto').innerHTML = `<pre>${ponto.letra}</pre>`;
        document.getElementById('modal-detalhes').style.display = 'block';
    }

    function fecharModal() {
        document.getElementById('modal-detalhes').style.display = 'none';
        // Limpa o conteúdo da mídia para parar o vídeo do YouTube ao fechar
        document.getElementById('modal-midia-container').innerHTML = '';
    }
</script>
