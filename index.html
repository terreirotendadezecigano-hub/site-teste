<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tenda de Zé Cigano - Painel Dirigente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-card: #141414;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #2a2a2a;
    }

    html, body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: var(--bg-card);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid var(--gold-primary);
    }

    h1 { color: var(--gold-primary); margin: 0; }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .form-card h2 {
      color: var(--gold-primary);
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--gold-primary);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--gold-primary);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover { background: var(--gold-light); }

    .status-msg {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    /* Oculta áreas restritas inicialmente */
    .oculto { display: none; }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-sair {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fas fa-star"></i> Tenda de Zé Cigano</h1>
    <p style="color: var(--text-muted); margin-top: 5px;">Painel Administrativo</p>
  </header>

  <div class="container">
    
    <!-- TELA DE LOGIN -->
    <div id="secaoLogin" class="form-card">
      <h2><i class="fas fa-lock"></i> Acesso do Dirigente</h2>
      <form id="formLogin">
        <div class="form-group">
          <label for="loginEmail">Digite seu E-mail:</label>
          <input type="email" id="loginEmail" placeholder="exemplo@gmail.com" required>
        </div>
        <button type="submit" id="btnLogin" class="btn-submit">Entrar no Sistema</button>
      </form>
      <div id="statusLogin" class="status-msg"></div>
    </div>

    <!-- TELA DE CADASTRO DE MEMBROS (Inicia oculta) -->
    <div id="secaoCadastro" class="form-card oculto">
      <div class="user-bar">
        <span>Olá, <b id="nomeUsuario" style="color: var(--gold-primary);"></b></span>
        <button id="btnSair" class="btn-sair"><i class="fas fa-sign-out-alt"></i> Sair</button>
      </div>

      <h2><i class="fas fa-user-plus"></i> Cadastro de Filho da Casa</h2>

      <form id="formCadastroMembro">
        <div class="form-group">
          <label for="cadNome">Nome Completo:</label>
          <input type="text" id="cadNome" placeholder="Digite o nome completo" required>
        </div>

        <div class="form-group">
          <label for="cadTelefone">Telefone / WhatsApp:</label>
          <input type="tel" id="cadTelefone" placeholder="(31) 99999-9999" required>
        </div>

        <div class="form-group">
          <label for="cadEmail">E-mail do Membro:</label>
          <input type="email" id="cadEmail" placeholder="exemplo@email.com">
        </div>

        <button type="submit" id="btnSalvarMembro" class="btn-submit">
          Salvar na Planilha
        </button>
      </form>

      <div id="statusCadastro" class="status-msg"></div>
    </div>

  </div>

  <script>
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbyFje_ocF7a0S7Tq4EYQmM5W3hv9SmHZqxJmWLhPKdkVfudzW-Q3EEbM66U9BiwdBZOJw/exec';

    // 1. LÓGICA DE LOGIN
    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();

      const emailInput = document.getElementById('loginEmail').value.trim();
      const statusLogin = document.getElementById('statusLogin');
      const btnLogin = document.getElementById('btnLogin');

      btnLogin.disabled = true;
      statusLogin.style.color = '#e0a800';
      statusLogin.innerText = '⏳ Verificando permissões...';

      fetch(`${URL_APPS_SCRIPT}?email=${encodeURIComponent(emailInput)}`)
        .then(res => res.json())
        .then(data => {
          if (data.autorizado) {
            statusLogin.style.color = '#28a745';
            statusLogin.innerText = '✅ ' + data.mensagem;
            
            setTimeout(() => {
              document.getElementById('secaoLogin').classList.add('oculto');
              document.getElementById('secaoCadastro').classList.remove('oculto');
              document.getElementById('nomeUsuario').innerText = data.nome;
            }, 800);
          } else {
            statusLogin.style.color = '#dc3545';
            statusLogin.innerText = '❌ ' + data.mensagem;
            btnLogin.disabled = false;
          }
        })
        .catch(err => {
          console.error(err);
          statusLogin.style.color = '#dc3545';
          statusLogin.innerText = '❌ Erro ao conectar. Tente novamente.';
          btnLogin.disabled = false;
        });
    });

    // 2. BOTÃO SAIR
    document.getElementById('btnSair').addEventListener('click', function() {
      document.getElementById('secaoCadastro').classList.add('oculto');
      document.getElementById('secaoLogin').classList.remove('oculto');
      document.getElementById('formLogin').reset();
      document.getElementById('statusLogin').innerText = '';
      document.getElementById('btnLogin').disabled = false;
    });

    // 3. LÓGICA DE CADASTRO
    document.getElementById('formCadastroMembro').addEventListener('submit', function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSalvarMembro');
      const status = document.getElementById('statusCadastro');

      const nome = document.getElementById('cadNome').value.trim();
      const telefone = document.getElementById('cadTelefone').value.trim();
      const email = document.getElementById('cadEmail').value.trim();

      btn.disabled = true;
      btn.style.opacity = '0.6';
      status.style.color = '#e0a800';
      status.innerText = '⏳ Salvando cadastro na planilha...';

      const idGerado = Math.random().toString(36).substring(2, 9);
      const dataHoje = new Date().toLocaleDateString('pt-BR');

      const payload = {
        nomeAba: "Cadastro_Filhos",
        valores: [
          idGerado,   // Coluna A: ID_Filho
          nome,       // Coluna B: Nome_Completo
          "",         // Coluna C: Data_Nascimento
          telefone,   // Coluna D: Telefone
          email,      // Coluna E: Email
          "",         // Coluna F: Endereco
          dataHoje,   // Coluna G: Data_Entrada
          "",         // Coluna H: Cargo_Funcao
          "",         // Coluna I: Orixa_Frente
          "Ativo"     // Coluna J: Status_Ativo
        ]
      };

      fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        status.style.color = '#28a745';
        status.innerText = '✅ Membro cadastrado com sucesso!';
        document.getElementById('formCadastroMembro').reset();
      })
      .catch(err => {
        console.error(err);
        status.style.color = '#dc3545';
        status.innerText = '❌ Erro ao cadastrar. Tente novamente.';
      })
      .finally(() => {
        btn.disabled = false;
        btn.style.opacity = '1';
      });
    });
  </script>
</body>
</html>
