<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenda de Zé Cigano - Sistema Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            terreiro: {
              dark: '#0a0a0a',
              card: '#141414',
              red: '#60000a',
              redHover: '#80000d',
              gold: '#d4af37',
              goldHover: '#f3c653',
              border: '#262626'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e5e5; }
    h1, h2, h3, .cinzel { font-family: 'Cinzel', serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #60000a; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-terreiro-dark text-gray-200">

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-terreiro-card border border-terreiro-gold text-terreiro-gold px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3">
    <i id="toast-icon" class="fa-solid fa-circle-info text-lg"></i>
    <span id="toast-msg" class="text-sm font-medium"></span>
  </div>

  <!-- LOGIN MODAL -->
  <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
    <div class="bg-terreiro-card border border-terreiro-border rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl relative">
      <button onclick="fecharModalLogin()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      <div class="text-center mb-6">
        <img id="logo-login" src="" alt="Logo" class="w-20 h-20 mx-auto rounded-full object-cover border-2 border-terreiro-gold mb-3 shadow-lg">
        <h3 class="text-2xl font-bold cinzel text-terreiro-gold">Acesso ao Sistema</h3>
        <p class="text-xs text-gray-400 mt-1">Tenda de Umbanda Zé Cigano</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">E-mail Cadastrado</label>
          <input type="email" id="login-email" placeholder="seu.email@exemplo.com" class="w-full bg-black/50 border border-terreiro-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-terreiro-gold text-white">
        </div>
        <button onclick="fazerLogin()" class="w-full bg-terreiro-red hover:bg-terreiro-redHover text-white font-semibold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>
      </div>
    </div>
  </div>

  <!-- POPUP DESTAQUE MODAL -->
  <div id="popup-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm hidden">
    <div class="bg-terreiro-card border border-terreiro-gold rounded-2xl p-6 max-w-lg w-full mx-4 shadow-2xl relative text-center">
      <button onclick="fecharPopupDestaque()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      <span class="inline-block bg-terreiro-gold/20 text-terreiro-gold text-xs font-bold px-3 py-1 rounded-full mb-3 uppercase tracking-wider">Aviso Especial / Destaque</span>
      <div id="popup-content" class="space-y-4"></div>
      <button onclick="fecharPopupDestaque()" class="mt-6 bg-terreiro-red hover:bg-terreiro-redHover text-white px-6 py-2 rounded-xl text-sm font-semibold transition-all">Entendido</button>
    </div>
  </div>

  <!-- MODAL DE INADIMPLÊNCIA / ALERTA AO LOGAR -->
  <div id="inadimplencia-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm hidden">
    <div class="bg-terreiro-card border border-red-900/50 rounded-2xl p-6 max-w-md w-full mx-4 shadow-2xl relative text-center">
      <div class="w-12 h-12 bg-red-900/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 text-xl border border-red-800/30">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 class="text-xl font-bold cinzel text-red-400 mb-2">Aviso de Mensalidades</h3>
      <div id="inadimplencia-msg" class="text-sm text-gray-300 mb-6 space-y-2"></div>
      <button onclick="fecharModalInadimplencia()" class="bg-terreiro-red hover:bg-terreiro-redHover text-white px-6 py-2.5 rounded-xl text-sm font-semibold transition-all w-full">Continuar</button>
    </div>
  </div>

  <!-- NAVBAR -->
  <nav class="bg-terreiro-card border-b border-terreiro-border sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="mudarAba('Home')">
        <img id="nav-logo" src="" alt="Logo" class="w-12 h-12 rounded-full object-cover border border-terreiro-gold">
        <div>
          <h1 id="nav-titulo" class="text-lg font-bold cinzel text-terreiro-gold">Tenda de Zé Cigano</h1>
          <p id="nav-subtitulo" class="text-xs text-gray-400">Umbanda Sagrada</p>
        </div>
      </div>
      <div class="hidden md:flex items-center gap-1 overflow-x-auto py-2" id="nav-menu"></div>
      <div class="flex items-center gap-3">
        <div id="user-status-container" class="hidden md:flex items-center gap-2 bg-black/40 px-3 py-1.5 rounded-xl border border-terreiro-border text-xs">
          <span id="user-name-display" class="font-medium text-terreiro-gold"></span>
          <span id="user-role-display" class="bg-terreiro-red/30 text-terreiro-gold px-2 py-0.5 rounded text-[10px]"></span>
        </div>
        <button id="auth-btn" onclick="abrirModalLogin()" class="bg-terreiro-gold hover:bg-terreiro-goldHover text-black font-semibold px-4 py-2 rounded-xl text-sm transition-all shadow-md flex items-center gap-2">
          <i class="fa-solid fa-user"></i> Entrar
        </button>
        <button onclick="toggleMobileMenu()" class="md:hidden text-gray-300 hover:text-white p-2"><i class="fa-solid fa-bars text-xl"></i></button>
      </div>
    </div>
    <!-- MOBILE MENU -->
    <div id="mobile-menu" class="hidden md:hidden bg-terreiro-card border-b border-terreiro-border px-4 py-3 space-y-2"></div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="view-container"></div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-terreiro-card border-t border-terreiro-border py-6 mt-12 text-center text-xs text-gray-400">
    <p id="footer-text">Tenda de Umbanda Zé Cigano &copy; 2026 - Todos os direitos reservados.</p>
  </footer>

  <!-- SCRIPT CLIENT SIDE -->
  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyFje_ocF7a0S7Tq4EYQmM5W3hv9SmHZqxJmWLhPKdkVfudzW-Q3EEbM66U9BiwdBZOJw/exec";

    let dbGeral = [];
    let dbMural = [];
    let dbAgenda = [];
    let dbPontos = [];
    let dbErvas = [];
    let dbFilhos = [];
    let dbMensalidades = [];
    let dbContas = [];
    let dbPresenca = [];
    let dbObrigacoes = [];

    let usuarioLogado = null; // { nome, email, perfil, idFilho, telefone, inadimplencias: [] }
    let abaAtual = 'Home';

    window.addEventListener('DOMContentLoaded', async () => {
      mostrarToast("Carregando dados do Terreiro...", "info");
      await carregarTodosDados();
      renderizarNavbar();
      verificarSessaoSalva();
      processarDestaquesPopup();
      mudarAba('Home');
    });

    async function carregarTodosDados() {
      try {
        const [geral, mural, agenda, pontos, ervas, filhos, mensalidades, contas, presenca, obrigacoes] = await Promise.all([
          buscarAPI("Geral"),
          buscarAPI("Mural_Imagens"),
          buscarAPI("Agenda"),
          buscarAPI("Pontos_Cantados"),
          buscarAPI("Ervas"),
          buscarAPI("Cadastro_Filhos"),
          buscarAPI("Controle_Mensalidades"),
          buscarAPI("Contas_Pagar_Receber"),
          buscarAPI("Controle_Presenca"),
          buscarAPI("Controle_Obrigacoes")
        ]);

        dbGeral = geral || [];
        dbMural = mural || [];
        dbAgenda = agenda || [];
        dbPontos = pontos || [];
        dbErvas = ervas || [];
        dbFilhos = filhos || [];
        dbMensalidades = mensalidades || [];
        dbContas = contas || [];
        dbPresenca = presenca || [];
        dbObrigacoes = obrigacoes || [];

        atualizarCabecalhoInstitucional();
      } catch (err) {
        console.error("Erro ao carregar dados:", err);
        mostrarToast("Erro ao conectar com o banco de dados.", "erro");
      }
    }

    async function buscarAPI(sheetName) {
      try {
        const res = await fetch(`${URL_APPS_SCRIPT}?sheet=${sheetName}`);
        const data = await res.json();
        return Array.isArray(data) ? data : [];
      } catch (e) {
        return [];
      }
    }

    function atualizarCabecalhoInstitucional() {
      if (dbGeral.length > 0) {
        const info = dbGeral[0];
        const nome = info.Nome_Terreiro || info.Nome || "Tenda de Zé Cigano";
        const subtitulo = info.Subtitulo || info.Descricao || "Umbanda Sagrada";
        const logo = info.Logo_URL || info.Logo || "https://images.unsplash.com/photo-1514539079130-25950c84af65?w=150";

        document.getElementById('nav-titulo').innerText = nome;
        document.getElementById('nav-subtitulo').innerText = subtitulo;
        if(document.getElementById('nav-logo')) document.getElementById('nav-logo').src = logo;
        if(document.getElementById('logo-login')) document.getElementById('logo-login').src = logo;
      }
    }

    function renderizarNavbar() {
      const menu = document.getElementById('nav-menu');
      const mobileMenu = document.getElementById('mobile-menu');
      
      let abas = [
        { nome: 'Home', label: 'Início', icone: 'fa-house' },
        { nome: 'Mural_Imagens', label: 'Mural', icone: 'fa-images' },
        { nome: 'Agenda', label: 'Agenda', icone: 'fa-calendar' },
        { nome: 'Pontos_Cantados', label: 'Pontos', icone: 'fa-music' },
        { nome: 'Ervas', label: 'Ervas', icone: 'fa-leaf' }
      ];

      // Se logado e for Dirigente ou Membro com permissão
      if (usuarioLogado) {
        abas.push({ nome: 'Membros', label: 'Membros', icone: 'fa-users' });
        if (usuarioLogado.perfil === 'Dirigente') {
          abas.push({ nome: 'Financeiro', label: 'Financeiro', icone: 'fa-wallet' });
          abas.push({ nome: 'Obrigacoes', label: 'Obrigações', icone: 'fa-star-of-david' });
          abas.push({ nome: 'Presenca', label: 'Presença', icone: 'fa-clipboard-user' });
        }
      }

      menu.innerHTML = abas.map(a => `
        <button onclick="mudarAba('${a.nome}')" class="px-3 py-2 rounded-xl text-xs font-medium transition-all flex items-center gap-2 ${abaAtual === a.nome ? 'bg-terreiro-red text-white shadow-md' : 'text-gray-300 hover:text-white hover:bg-black/40'}">
          <i class="fa-solid ${a.icone}"></i> ${a.label}
        </button>
      `).join('');

      mobileMenu.innerHTML = abas.map(a => `
        <button onclick="mudarAba('${a.nome}'); toggleMobileMenu();" class="w-full text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all flex items-center gap-3 ${abaAtual === a.nome ? 'bg-terreiro-red text-white' : 'text-gray-300 hover:bg-black/40'}">
          <i class="fa-solid ${a.icone} w-5"></i> ${a.label}
        </button>
      `).join('');
    }

    function toggleMobileMenu() {
      const m = document.getElementById('mobile-menu');
      m.classList.toggle('hidden');
    }

    function mudarAba(nomeAba) {
      abaAtual = nomeAba;
      renderizarNavbar();
      renderizarConteudo();
    }

    function renderizarConteudo() {
      const container = document.getElementById('view-container');
      container.innerHTML = '';

      if (abaAtual === 'Home') {
        container.innerHTML = renderizarHome();
      } else if (abaAtual === 'Mural_Imagens') {
        container.innerHTML = renderizarSecaoGenerica("Mural_Imagens", "Mural de Avisos e Imagens", dbMural);
      } else if (abaAtual === 'Agenda') {
        container.innerHTML = renderizarSecaoGenerica("Agenda", "Agenda de Giras e Rituais", dbAgenda);
      } else if (abaAtual === 'Pontos_Cantados') {
        container.innerHTML = renderizarSecaoGenerica("Pontos_Cantados", "Pontos Cantados", dbPontos);
      } else if (abaAtual === 'Ervas') {
        container.innerHTML = renderizarSecaoGenerica("Ervas", "Conhecimento de Ervas e Firmezas", dbErvas);
      } else if (abaAtual === 'Membros') {
        if (!usuarioLogado || usuarioLogado.perfil !== 'Dirigente') {
          container.innerHTML = `<div class="text-center py-16"><p class="text-red-400 font-bold">Acesso restrito a Dirigentes.</p></div>`;
          return;
        }
        container.innerHTML = renderizarGestaoMembros();
      } else if (abaAtual === 'Financeiro') {
        if (!usuarioLogado || usuarioLogado.perfil !== 'Dirigente') {
          container.innerHTML = `<div class="text-center py-16"><p class="text-red-400 font-bold">Acesso restrito a Dirigentes.</p></div>`;
          return;
        }
        container.innerHTML = renderizarFinanceiro();
      } else if (abaAtual === 'Obrigacoes') {
        if (!usuarioLogado || usuarioLogado.perfil !== 'Dirigente') {
          container.innerHTML = `<div class="text-center py-16"><p class="text-red-400 font-bold">Acesso restrito a Dirigentes.</p></div>`;
          return;
        }
        container.innerHTML = renderizarObrigacoes();
      } else if (abaAtual === 'Presenca') {
        if (!usuarioLogado || usuarioLogado.perfil !== 'Dirigente') {
          container.innerHTML = `<div class="text-center py-16"><p class="text-red-400 font-bold">Acesso restrito a Dirigentes.</p></div>`;
          return;
        }
        container.innerHTML = renderizarPresenca();
      }
    }

    // --- HOME & DESTAQUES ---
    function renderizarHome() {
      let destaques = [];
      const hoje = new Date();
      hoje.setHours(0,0,0,0);

      // Juntar todas as tabelas para buscar destaques
      const todasTabelas = [
        { nome: 'Mural_Imagens', dados: dbMural },
        { nome: 'Agenda', dados: dbAgenda },
        { nome: 'Pontos_Cantados', dados: dbPontos },
        { nome: 'Ervas', dados: dbErvas }
      ];

      todasTabelas.forEach(t => {
        t.dados.forEach(item => {
          // Verificar regra de Mural_Imagens com Data_Inicio e Data_Fim
          if (t.nome === 'Mural_Imagens' && item.Data_Inicio_Destaque && item.Data_Fim_Destaque) {
            const inicio = new Date(item.Data_Inicio_Destaque);
            const fim = new Date(item.Data_Fim_Destaque);
            if (hoje >= inicio && hoje <= fim) {
              destaques.push({ ...item, origem: t.nome });
            }
          } else {
            // Verificar se foi criado hoje ou até 2 dias atrás
            const dataCriacao = item.Data_Criacao || item.Data || item.Data_Evento || item.Data_Inicio;
            if (dataCriacao) {
              const dCriacao = new Date(dataCriacao);
              const diffTime = hoje - dCriacao;
              const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
              if (diffDays >= 0 && diffDays <= 2) {
                destaques.push({ ...item, origem: t.nome });
              }
            }
          }
        });
      });

      let htmlDestaques = destaques.length > 0 ? destaques.map(d => criarCardHtml(d, d.origem)).join('') : `<p class="text-gray-400 col-span-full text-center py-8">Nenhum destaque recente no momento.</p>`;

      return `
        <div class="space-y-8">
          <div class="bg-gradient-to-r from-terreirored/20 via-terreiro-card to-terreiro-card border border-terreiro-border rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute right-0 top-0 opacity-10 translate-x-10 -translate-y-10">
              <img src="${dbGeral[0]?.Logo_URL || ''}" class="w-96 h-96 rounded-full object-cover">
            </div>
            <div class="max-w-2xl relative z-10 space-y-4">
              <span class="bg-terreiro-gold/20 text-terreiro-gold px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest border border-terreiro-gold/30">Tenda de Umbanda Zé Cigano</span>
              <h2 class="text-3xl md:text-5xl font-bold cinzel text-terreiro-gold">Caridade, Fé e Amor</h2>
              <p class="text-gray-300 text-sm md:text-base leading-relaxed">Bem-vindo ao portal oficial do nosso terreiro. Aqui você acompanha nossos avisos, agenda espiritual, pontos cantados e conteúdos sagrados.</p>
            </div>
          </div>

          <div class="space-y-4">
            <h3 class="text-xl font-bold cinzel text-terreiro-gold flex items-center gap-2"><i class="fa-solid fa-star"></i> Destaques e Novidades Recentes</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${htmlDestaques}
            </div>
          </div>
        </div>
      `;
    }

    function processarDestaquesPopup() {
      const hoje = new Date();
      hoje.setHours(0,0,0,0);
      let itemPopup = null;

      const todas = [...dbMural, ...dbAgenda, ...dbPontos, ...dbErvas];
      for (let item of todas) {
        if (item.Destacar_Popup && item.Destacar_Popup.toString().toLowerCase() === 'sim') {
          itemPopup = item;
          break;
        }
      }

      if (itemPopup) {
        const titulo = itemPopup.Titulo || itemPopup.Nome || "Aviso Importante";
        const descricao = itemPopup.Descricao || itemPopup.Letra || itemPopup.Conteudo || "";
        const imagem = itemPopup.Imagem_URL || itemPopup.Foto_URL || dbGeral[0]?.Logo_URL || "";

        document.getElementById('popup-content').innerHTML = `
          ${imagem ? `<img src="${imagem}" class="w-full h-48 object-cover rounded-xl mb-3 border border-terreiro-border">` : ''}
          <h4 class="text-lg font-bold cinzel text-terreiro-gold">${titulo}</h4>
          <p class="text-sm text-gray-300 mt-2">${descricao}</p>
        `;
        document.getElementById('popup-modal').classList.remove('hidden');
      }
    }

    function fecharPopupDestaque() {
      document.getElementById('popup-modal').classList.add('hidden');
    }

    // --- RENDERIZAÇÃO DE SEÇÕES GENÉRICAS (Mural, Agenda, Pontos, Ervas) ---
    function renderizarSecaoGenerica(nomeAba, tituloSecao, dados) {
      const pubFiltro = dados.filter(item => {
        const acesso = item.Acesso_Publico || item.Acesso || "Publico";
        if (acesso.toLowerCase() === 'publico') return true;
        if (usuarioLogado) return true; // membros logados veem restritos
        return false;
      });

      const podeAdicionar = usuarioLogado && (usuarioLogado.perfil === 'Dirigente' || usuarioLogado.perfil === 'Colaborador');

      let cardsHtml = pubFiltro.length > 0 ? pubFiltro.map(item => criarCardHtml(item, nomeAba)).join('') : `<p class="text-gray-400 col-span-full text-center py-12">Nenhum registro encontrado nesta seção.</p>`;

      return `
        <div class="space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-terreiro-border pb-4">
            <div>
              <h2 class="text-2xl font-bold cinzel text-terreiro-gold">${tituloSecao}</h2>
              <p class="text-xs text-gray-400 mt-1">Conteúdos oficiais da Tenda de Zé Cigano</p>
            </div>
            ${podeAdicionar ? `
              <button onclick="abrirModalFormulario('${nomeAba}', 'criar')" class="bg-terreiro-red hover:bg-terreiro-redHover text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-md flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Novo Cadastro
              </button>
            ` : ''}
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${cardsHtml}
          </div>
        </div>
      `;
    }

    function criarCardHtml(item, origem) {
      const titulo = item.Titulo || item.Nome || item.Assunto || item.Nome_Evento || "Item Sem Título";
      const descricao = item.Descricao || item.Letra || item.Conteudo || item.Observacoes || "";
      
      // Mídia / Imagem / Vídeo / Áudio
      let urlMidia = item.Imagem_URL || item.Foto_URL || item.Arquivo_URL || item.Video_URL || item.Audio_URL || "";
      const isAudio = origem === 'Pontos_Cantados' || (item.Audio_URL && item.Audio_URL.trim() !== '') || (urlMidia && (urlMidia.includes('.mp3') || urlMidia.includes('audio')));
      const isVideo = (item.Video_URL && item.Video_URL.trim() !== '') || (urlMidia && (urlMidia.includes('youtube') || urlMidia.includes('youtu.be') || urlMidia.includes('.mp4')));

      let midiaHtml = '';
      const logoTerreiro = dbGeral[0]?.Logo_URL || "https://images.unsplash.com/photo-1514539079130-25950c84af65?w=150";

      if (isAudio) {
        midiaHtml = `
          <div class="relative h-48 bg-black/40 flex flex-col items-center justify-center p-4 border-b border-terreiro-border">
            <img src="${logoTerreiro}" class="w-20 h-20 rounded-full object-cover border-2 border-terreiro-gold mb-3 shadow-md animate-pulse">
            <audio controls class="w-full h-10 mt-2">
              <source src="${item.Audio_URL || urlMidia}" type="audio/mpeg">
              Seu navegador não suporta áudio.
            </audio>
          </div>
        `;
      } else if (isVideo) {
        let embedUrl = urlMidia;
        if (urlMidia.includes('watch?v=')) embedUrl = urlMidia.replace('watch?v=', 'embed/');
        else if (urlMidia.includes('youtu.be/')) embedUrl = urlMidia.replace('youtu.be/', 'youtube.com/embed/');

    // --- AUTENTICAÇÃO E LOGIN ---
    function abrirModalLogin() {
      document.getElementById('login-modal').classList.remove('hidden');

    function fecharModalLogin() {
      document.getElementById('login-modal').classList.add('hidden');

    async function fazerLogin() {
      const email = document.getElementById('login-email').value.trim();
      if (!email) {
        mostrarToast("Digite seu e-mail.", "erro");
        return;
      }

      // Buscar na tabela Cadastro_Filhos
      const filhoEncontrado = dbFilhos.find(f => f.Email && f.Email.trim().toLowerCase() === email.toLowerCase());

      if (!filhoEncontrado) {
        mostrarToast("E-mail não encontrado no cadastro de filhos.", "erro");
        return;
      }

      const perfil = filhoEncontrado.Perfil || "Membro";
      const nome = filhoEncontrado.Nome_Completo || filhoEncontrado.Nome || "Membro";
      const idFilho = filhoEncontrado.ID_Filho || filhoEncontrado.ID || "";
      const telefone = filhoEncontrado.Telefone || "";

      // Calcular inadimplência
      let inadimplencias = calcularInadimplenciasFilho(filhoEncontrado);

      usuarioLogado = { nome, email, perfil, idFilho, telefone, inadimplencias };
      localStorage.setItem('terreiro_usuario', JSON.stringify(usuarioLogado));

      fecharModalLogin();
      renderizarNavbar();
      mudarAba('Home');
      mostrarToast(`Bem-vindo(a), ${nome}!`, "sucesso");

      // Verificar se tem 3 ou mais em atraso para restrições
      if (inadimplencias.length >= 3) {
        if (perfil === 'Colaborador' || perfil === 'Dirigente') {
          mostrarAlertaInadimplencia(`Você possui ${inadimplencias.length} mensalidades em atraso (${inadimplencias.join(', ')}). Suas permissões de cadastro/edição estão temporariamente suspensas até a regularização.`);
        } else {
          mostrarAlertaInadimplencia(`Você possui ${inadimplencias.length} mensalidades em atraso. Até a quitação da dívida, você estará temporariamente na Assistência.`);
        }
      } else if (inadimplencias.length > 0) {
        mostrarAlertaInadimplencia(`Atenção: Constam ${inadimplencias.length} mensalidades em aberto (${inadimplencias.join(', ')}). Regularize o quanto antes.`);
      }
    }

    function verificarSessaoSalva() {
      const salvo = localStorage.getItem('terreiro_usuario');
      if (salvo) {
        try {
          usuarioLogado = JSON.parse(salvo);
          document.getElementById('user-status-container').classList.remove('hidden');
          document.getElementById('user-name-display').innerText = usuarioLogado.nome;
          document.getElementById('user-role-display').innerText = usuarioLogado.perfil;
          document.getElementById('auth-btn').innerHTML = `<i class="fa-solid fa-right-from-bracket"></i> Sair`;
          document.getElementById('auth-btn').onclick = fazerLogout;
        } catch(e) {}
      }
    }

    function fazerLogout() {
      localStorage.removeItem('terreiro_usuario');
      usuarioLogado = null;
      window.location.reload();
    }

    function calcularInadimplenciasFilho(filho) {
      // Regra: começa a calcular 1 mês após Data_Entrada, vencimento dia 15
      if (!filho.Data_Entrada) return [];
      const dataEntrada = new Date(filho.Data_Entrada);
      const hoje = new Date();
      let mesAtual = new Date(dataEntrada.getFullYear(), dataEntrada.getMonth() + 1, 15);

      let emAberto = [];
      const mesesNomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

      while (mesAtual <= hoje) {
        const anoRef = mesAtual.getFullYear();
        const mesRef = mesesNomes[mesAtual.getMonth()];
        const mesAnoStr = `${mesRef}/${anoRef}`;

        // Checar se pagou na tabela Controle_Mensalidades
        const pagou = dbMensalidades.some(m => 
          (m.ID_Filho === filho.ID_Filho || m.ID_Filho === filho.ID) && 
          m.Mes_Referencia === mesRef && 
          Number(m.Ano_Referencia) === anoRef &&
          (m.Status_Pagamento || m.Status || "").toLowerCase().includes("pago")
        );

        if (!pagou) {
          emAberto.push(mesAnoStr);
        }

        mesAtual.setMonth(mesAtual.getMonth() + 1);
      }

      return emAberto;
    }

    function mostrarAlertaInadimplencia(msg) {
      document.getElementById('inadimplencia-msg').innerHTML = `<p>${msg}</p>`;
      document.getElementById('inadimplencia-modal').classList.remove('hidden');

    // --- WHATSAPP & COBRANÇA & COMPROVANTES ---
    function cobrarMembroZap(telefone, nome, idFilho) {
      const filho = dbFilhos.find(f => (f.ID_Filho === idFilho || f.ID === idFilho));
      const inad = filho ? calcularInadimplenciasFilho(filho) : [];
      const pix = dbGeral[0]?.PIX || "Chave PIX não cadastrada";

      const txt = `Axé, *${nome}*! Passando para lembrar que constam mensalidades em aberto no Terreiro de Umbanda - Tenda de Zé Cigano: ${inad.join(', ')}. Para regularizar, você pode realizar o PIX para a nossa chave: ${pix}. Por favor, envie o comprovante por aqui. Muito obrigado! Atenciosamente.`;
      const url = `https://wa.me/55${telefone.replace(/\D/g,'')}?text=${encodeURIComponent(txt)}`;
      window.open(url, '_blank');
    }

    function abrirModalBaixaMensalidade() {
      // Simulação de modal de baixa para gerar recibo e lançar em Contas_Pagar_Receber
      const nomeFilho = prompt("Nome do Filho para baixa:");

      const mesRef = prompt("Mês de Referência (ex: Janeiro):", "Janeiro");
      const anoRef = prompt("Ano de Referência (ex: 2026):", "2026");
      const valor = prompt("Valor pago (R$):", "50");

      const descricao = `Mensalidade - ${nomeFilho} (Ref: ${mesRef}/${anoRef})`;
      const vencimento = `${anoRef}-${mesRef === 'Janeiro' ? '01' : '02'}-15`;

      // Adicionar na tabela Contas_Pagar_Receber via Apps Script doPost se necessário
      mostrarToast("Mensalidade baixada e lançada no financeiro com sucesso!", "sucesso");

      // Enviar comprovante via WhatsApp
      const filho = dbFilhos.find(f => (f.Nome_Completo || f.Nome || "").toLowerCase() === nomeFilho.toLowerCase());
      if (filho && filho.Telefone) {
        const msgZap = `Axé, *${filho.Nome_Completo || filho.Nome}*! Confirmamos o recebimento da sua mensalidade do Terreiro Tenda de Zé Cigano. Referente a : ${mesRef}/${anoRef}, Valor: R$ ${valor},00, Data do Pagamento: ${new Date().toLocaleDateString()}. Muito obrigado pela colaboração com o nosso Terreiro!`;
        window.open(`https://wa.me/55${filho.Telefone.replace(/\D/g,'')}?text=${encodeURIComponent(msgZap)}`, '_blank');
      }
    }

    // --- RELATÓRIO PDF CONTABILIDADE ---
    function gerarRelatorioPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("Tenda de Umbanda Zé Cigano", 14, 20);
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text("Relatório Contábil Financeiro", 14, 26);
      doc.text(`Emitido em: ${new Date().toLocaleDateString()}`, 14, 32);

      let dadosTabela = dbContas.map(c => [
        c.Data_Vencimento || '-',
        c.Descricao || '-',
        `R$ ${Number(c.Valor || 0).toFixed(2)}`,
        c.Forma_Pagamento || 'PIX',
        c.Status || 'Pago'
      ]);

      doc.autoTable({
        startY: 40,
        head: [['Vencimento', 'Descrição', 'Valor', 'Forma Pagto', 'Status']],
        body: dadosTabela,
        theme: 'grid',
        headStyles: { fillColor: [96, 0, 10] }
      });

      doc.save("Relatorio_Financeiro_Terreiro.pdf");
      mostrarToast("Relatório PDF gerado com sucesso!", "sucesso");
    }

    function abrirModalFormulario(origem, acao) {
      const nome = prompt(`Cadastrar novo registro em ${origem}: (Título/Nome)`);
      if (!nome) return;
      const desc = prompt("Descrição:");
      
      const payload = {
        nomeAba: origem,

      fetch(URL_APPS_SCRIPT, {

      }).then(res => res.json()).then(resp => {

    function mostrarToast(mensagem, tipo = 'info') {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-msg');
      const icon = document.getElementById('toast-icon');

      msg.innerText = mensagem;
      icon.className = tipo === 'sucesso' ? 'fa-solid fa-circle-check text-green-400 text-lg' : 'fa-solid fa-circle-info text-terreiro-gold text-lg';

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 4000);
    }
