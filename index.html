    }


    // =================================================================
    // 3. CARREGAMENTO DOS DADOS DA TABELA "CADASTRO FILHO"
    // =================================================================
    // Exemplo de estrutura da sua tabela de membros com todas as colunas
    let listaFilhosDeSanto = [
      {
        id: "1",
        nome: "João de Ogum",
        cargo: "Filho de Santo",
        telefone: "(31) 99999-0001",
        email: "joao@email.com",
        dataNascimento: "1990-05-15",
        orixaHead: "Ogum",
        status: "Ativo"
      },
      {
        id: "2",
        nome: "Maria de Oxum",
        cargo: "Filha de Santo",
        telefone: "(31) 99999-0002",
        email: "maria@email.com",
        dataNascimento: "1988-10-20",
        orixaHead: "Oxum",
        status: "Ativo"
      }
    ];

    function carregarDados() {
      // Sua lógica original de inicialização e busca de dados
      console.log("Dados carregados com sucesso.");
      renderizarTabelaMembros(listaFilhosDeSanto);
    }


    // =================================================================
    // 4. PREENCHER TODOS OS DADOS DA TABELA AO CLICAR EM EDITAR (EXCETO O ID)
    // =================================================================
    function editarMembro(idMembro) {
      // Busca o registro completo na tabela Cadastro Filho pelo ID
      const membro = listaFilhosDeSanto.find(item => item.id === String(idMembro));

      if (!membro) {
        console.error("Membro não encontrado no cadastro.");
        return;
      }

      // Preenche o ID em um campo oculto (para saber quem atualizar no salvar, sem permitir alterá-lo)
      if (document.getElementById('editId')) {
        document.getElementById('editId').value = membro.id;
      }

      // Preenche TODAS as outras colunas da tabela nos respectivos campos do seu formulário/modal:
      if (document.getElementById('editNome'))           document.getElementById('editNome').value = membro.nome || '';
      if (document.getElementById('editCargo'))          document.getElementById('editCargo').value = membro.cargo || '';
      if (document.getElementById('editTelefone'))       document.getElementById('editTelefone').value = membro.telefone || '';
      if (document.getElementById('editEmail'))          document.getElementById('editEmail').value = membro.email || '';
      if (document.getElementById('editDataNascimento')) document.getElementById('editDataNascimento').value = membro.dataNascimento || '';
      if (document.getElementById('editOrixa'))          document.getElementById('editOrixa').value = membro.orixaHead || '';
      if (document.getElementById('editStatus'))         document.getElementById('editStatus').value = membro.status || '';

      // Abre a tela/modal de edição do seu sistema
      const modal = document.getElementById('modalEditarMembro') || document.getElementById('modalEdicao');
      if (modal) {
        modal.style.display = 'block';
      }
    }


    // =================================================================
    // 5. INICIALIZAÇÃO DA PÁGINA (CONFORME SEU CÓDIGO ORIGINAL)
    // =================================================================
    window.onload = carregarDados;
  </script>
</body>
