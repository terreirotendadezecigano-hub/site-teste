<!-- Modal de Edição de Membro -->
<div id="editModal" class="modal" style="display: none;">
  <div class="modal-content">
    <span class="close-btn" onclick="closeEditModal()">&times;</span>
    <h3>Editar Membro</h3>
    
    <form id="formEditMembro" onsubmit="salvarEdicaoMembro(event)">
      <input type="hidden" id="editMembroId">

      <div class="modal-grid">
        <div class="form-group full-width">
          <label for="editNome">Nome Completo</label>
          <input type="text" id="editNome" required>
        </div>

        <div class="form-group">
          <label for="editCargo">Cargo / Função</label>
          <input type="text" id="editCargo">
        </div>

        <div class="form-group">
          <label for="editTelefone">Telefone / WhatsApp</label>
          <input type="text" id="editTelefone">
        </div>

        <div class="form-group">
          <label for="editEmail">E-mail</label>
          <input type="email" id="editEmail">
        </div>

        <div class="form-group">
          <label for="editDataNasc">Data de Nascimento</label>
          <input type="text" id="editDataNasc" placeholder="dd/mm/aaaa">
        </div>

        <div class="form-group">
          <label for="editOrixa">Orixá de Frente</label>
          <input type="text" id="editOrixa">
        </div>

        <div class="form-group">
          <label for="editPerfil">Perfil de Acesso</label>
          <select id="editPerfil">
            <option value="Dirigente">Dirigente</option>
            <option value="Membro">Membro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editStatus">Status</label>
          <select id="editStatus">
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn-save">Salvar Membro</button>
        <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
